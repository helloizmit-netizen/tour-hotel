<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투어 호텔 노트</title>
<style>
  :root{--bg:#0e1419;--surface:#161f29;--surface2:#1e2a36;--line:#2a3744;--text:#e8eef3;--muted:#8a9aab;--accent:#e8a33d;--accent2:#3da6e8;--green:#4fc08d;--red:#e06650;--radius:16px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:radial-gradient(900px 500px at 90% -10%, rgba(232,163,61,.10), transparent 60%),radial-gradient(700px 500px at -10% 110%, rgba(61,166,232,.08), transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:rgba(14,20,25,.82);border-bottom:1px solid var(--line);}
  .head-in{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c97f1a);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(232,163,61,.35);}
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px;}
  .brand span{font-size:11px;color:var(--muted);display:block;margin-top:1px;}
  .count-pill{font-size:12px;color:var(--accent);background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);padding:5px 11px;border-radius:999px;font-weight:600;}
  .upload{margin:18px 0 8px;border:1.5px dashed var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--surface),rgba(22,31,41,.4));padding:22px 18px;text-align:center;}
  .upload .ic{font-size:30px;}
  .upload .t{font-weight:600;margin-top:6px;}
  .upload .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:12px;border-radius:12px;font-size:14px;transition:.15s;}
  .btn:active{transform:scale(.97);}
  .btn-pri{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .sched-thumb{margin-top:12px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .sched-thumb img{width:100%;display:block;}
  .sched-thumb .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
  .toolbar{display:flex;align-items:center;gap:8px;margin:22px 4px 12px;flex-wrap:wrap;}
  .toolbar .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-right:auto;}
  .backupbar{display:flex;gap:8px;margin:12px 0 0;}
  .backupbar button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .backupbar button:active{transform:scale(.97);}
  .backupbar button b{color:var(--accent2);}
  .typetabs{display:flex;gap:6px;margin:18px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;}
  .typetabs button{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;transition:.15s;}
  .typetabs button.active{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .typetabs button .n{font-size:10px;opacity:.7;margin-left:3px;}
  /* 카드 내 분류 체크 */
  .typepick{display:flex;gap:8px;margin-top:14px;}
  .typepick .tp{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;user-select:none;}
  .typepick .tp.on{border-color:var(--accent);background:rgba(232,163,61,.14);color:var(--accent);}
  .citychips{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;-webkit-overflow-scrolling:touch;}
  .citychips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip.active{background:rgba(61,166,232,.15);border-color:var(--accent2);color:var(--accent2);font-weight:600;}
  .chip .n{font-size:10px;opacity:.7;margin-left:3px;}
  select.sortsel{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:12.5px;}
  .card{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .card-head{padding:15px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
  .daybadge{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:rgba(61,166,232,.14);border:1px solid rgba(61,166,232,.3);display:grid;place-items:center;text-align:center;line-height:1.05;}
  .daybadge b{font-size:17px;color:var(--accent2);}
  .daybadge small{font-size:9px;color:var(--muted);}
  .card-head .meta{flex:1;min-width:0;}
  .card-head .hname{font-size:16px;font-weight:700;margin:0;}
  .card-head .hsub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .citytag{font-size:10.5px;padding:2px 8px;border-radius:6px;background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);color:var(--accent);}
  .chev{color:var(--muted);font-size:13px;transition:.2s;margin-top:4px;}
  .card.open .chev{transform:rotate(90deg);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
  .tag.on{color:var(--green);border-color:rgba(79,192,141,.4);background:rgba(79,192,141,.1);}
  .tag.off{color:var(--red);border-color:rgba(224,102,80,.35);background:rgba(224,102,80,.08);}
  .card-body{display:none;border-top:1px solid var(--line);padding:4px 16px 16px;}
  .card.open .card-body{display:block;}
  .field{margin-top:14px;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;transition:.15s;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2);}
  .field textarea{resize:vertical;min-height:54px;}
  .two{display:flex;gap:10px;}
  .two .field{flex:1;}
  .toggle-row{display:flex;gap:8px;margin-top:14px;}
  .tg{flex:1;text-align:center;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12.5px;color:var(--muted);transition:.15s;user-select:none;}
  .tg .ti{font-size:17px;display:block;margin-bottom:3px;}
  .tg.active-yes{border-color:rgba(79,192,141,.5);background:rgba(79,192,141,.12);color:var(--green);}
  .tg.active-no{border-color:rgba(224,102,80,.45);background:rgba(224,102,80,.1);color:var(--red);}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo img{width:100%;height:100%;object-fit:cover;}
  .photo .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border:none;color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;}
  .addphoto{width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:22px;}
  .guestcopy{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(232,163,61,.3);transition:.15s;}
  .guestcopy:active{transform:scale(.98);}
  .guestcopy.done{background:linear-gradient(135deg,var(--green),#37a877);color:#06281a;}
  .mapbtn{margin-top:16px;width:100%;padding:12px;border-radius:11px;border:1px solid rgba(61,166,232,.45);background:rgba(61,166,232,.12);color:var(--accent2);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .mapbtn:active{transform:scale(.98);}
  .card-actions{display:flex;gap:8px;margin-top:12px;}
  .save-btn{flex:2;background:rgba(79,192,141,.14);color:var(--green);border:1px solid rgba(79,192,141,.45);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;}
  .save-btn:active{transform:scale(.98);}
  .del-btn{background:rgba(224,102,80,.1);color:var(--red);border:1px solid rgba(224,102,80,.3);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;flex:1;}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);}
  .empty .ic{font-size:44px;opacity:.5;}
  .empty p{font-size:13.5px;line-height:1.6;margin-top:10px;}
  .fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;max-width:528px;width:calc(100% - 32px);display:flex;gap:10px;}
  .fab button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:15px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .fab .add{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .saved-flash{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#06281a;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:50;pointer-events:none;max-width:90%;text-align:center;}
  .saved-flash.show{opacity:1;}
  /* OCR 진행/선택 모달 */
  .modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;margin:0 auto;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--line);}
  .modal-head{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-head p{margin:4px 0 0;font-size:12px;color:var(--muted);}
  .modal-body{padding:14px 18px;overflow-y:auto;flex:1;}
  .ocr-status{text-align:center;padding:30px 10px;color:var(--muted);font-size:13.5px;}
  .ocr-bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin:14px auto 0;max-width:240px;}
  .ocr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s;}
  .cand{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);cursor:pointer;}
  .cand.sel{border-color:var(--accent2);background:rgba(61,166,232,.1);}
  .cand .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:13px;color:#06281a;}
  .cand.sel .ck{background:var(--accent2);border-color:var(--accent2);}
  .cand .nm{flex:1;font-size:14px;}
  .cand .cty{font-size:10.5px;color:var(--accent);}
  .modal-foot{padding:12px 18px 20px;border-top:1px solid var(--line);display:flex;gap:10px;}
  .modal-foot button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;padding:13px;border-radius:12px;}
  .mf-add{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .mf-cancel{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
  .manual-add{margin-top:10px;display:flex;gap:8px;}
  .manual-add input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;}
  .manual-add button{background:var(--surface2);border:1px solid var(--line);color:var(--accent2);border-radius:10px;padding:0 14px;font-family:inherit;font-weight:600;cursor:pointer;}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand"><div class="logo">🏨</div><div><h1>투어 호텔 노트</h1><span>Emre 가이드 전용 · 자동 저장</span></div></div>
    <div class="count-pill" id="countPill">0곳</div>
  </div>
</header>
<div class="wrap">
  <div class="upload" id="uploadZone">
    <div class="ic">📋</div>
    <div class="t">일정표 사진 올리기</div>
    <div class="s">사진을 올리면 호텔 이름을 자동으로 읽어 카드를 만들어요.<br>인식이 안 되면 직접 추가할 수 있어요.</div>
    <div class="btn-row">
      <button class="btn btn-pri" id="btnSchedule">📷 일정표 첨부</button>
      <button class="btn btn-sec" id="btnManual">+ 직접 추가</button>
    </div>
    <div id="schedThumbWrap"></div>
  </div>
  <div class="backupbar">
    <button id="btnBackup">💾 <b>백업 저장</b> (파일로 내보내기)</button>
    <button id="btnRestore">📥 <b>복원</b> (불러오기)</button>
  </div>
  <div class="typetabs" id="typeTabs"></div>
  <div class="toolbar">
    <span class="lbl">방문 호텔</span>
    <select class="sortsel" id="sortSel">
      <option value="order">일정 순서</option>
      <option value="city">도시별</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="citychips" id="cityChips"></div>
  <div id="list"></div>
</div>
<div class="fab"><button class="add" id="fabAdd">＋ 호텔 추가</button></div>
<div class="saved-flash" id="flash">저장됨 ✓</div>
<div class="modal-bg" id="ocrModal">
  <div class="modal">
    <div class="modal-head"><h3>📋 일정표에서 호텔 찾기</h3><p id="ocrSub">사진을 분석하고 있어요...</p></div>
    <div class="modal-body" id="ocrBody"></div>
    <div class="modal-foot" id="ocrFoot" style="display:none">
      <button class="mf-cancel" data-act="ocrcancel">취소</button>
      <button class="mf-add" data-act="ocradd">선택한 호텔 추가</button>
    </div>
  </div>
</div>
<input type="file" id="schedInput" accept="image/*" hidden>
<input type="file" id="photoInput" accept="image/*" hidden multiple>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>
<script>
const CITIES=['이스탄불','앙카라','부르사','이즈미르','쿠샤다스','파묵칼레','카파도키아','콘야','안탈리아','아피온','아이발륵'];
const CITY_HINTS={
  '이스탄불':['istanbul','이스탄불','sultanahmet','술탄','taksim','탁심','bosphorus','보스포러스','fatih'],
  '앙카라':['ankara','앙카라','kizilay','kızılay'],
  '부르사':['bursa','부르사','uludag','uludağ','울루다'],
  '이즈미르':['izmir','이즈미르','alsancak','ephesus','에페소','셀축','selcuk','selçuk'],
  '쿠샤다스':['kusadasi','kuşadası','쿠샤다스','쿠사다스'],
  '파묵칼레':['pamukkale','파묵칼레','hierapolis','히에라폴리스','denizli','데니즐리'],
  '카파도키아':['cappadocia','kapadokya','카파도키아','goreme','göreme','괴레메','uchisar','우치사르','urgup','ürgüp','네브셰히르','nevsehir','avanos','아바노스','kaymakli','카이막르'],
  '콘야':['konya','콘야','mevlana','메블라나'],
  '안탈리아':['antalya','안탈리아','kaleici','kaleiçi','lara','벨렉','belek'],
  '아피온':['afyon','아피온','afyonkarahisar'],
  '아이발륵':['ayvalik','ayvalık','아이발륵','아이발릭','cunda','junda']
};
const CITY_DEFAULTS={
  '이스탄불':{breakfast:'07:00~10:00',alcohol:true},'앙카라':{breakfast:'07:00~09:30',alcohol:true},
  '부르사':{breakfast:'07:00~09:30',alcohol:false},'이즈미르':{breakfast:'07:00~10:00',alcohol:true},
  '파묵칼레':{breakfast:'07:30~09:30',alcohol:true},'카파도키아':{breakfast:'07:00~10:00',alcohol:true},
  '콘야':{breakfast:'07:00~09:00',alcohol:false},'안탈리아':{breakfast:'07:00~10:00',alcohol:true},
  '아피온':{breakfast:'07:00~09:30',alcohol:false},
  '쿠샤다스':{breakfast:'07:00~10:00',alcohol:true},'아이발륵':{breakfast:'07:00~09:30',alcohol:true}
};
const CITY_EN={'이스탄불':'Istanbul','앙카라':'Ankara','부르사':'Bursa','이즈미르':'Izmir','쿠샤다스':'Kusadasi','파묵칼레':'Pamukkale','카파도키아':'Cappadocia','콘야':'Konya','안탈리아':'Antalya','아피온':'Afyon','아이발륵':'Ayvalik'};
const KEY='tour_hotel_notes_v3';
const LIBKEY='tour_hotel_library_v1';

/* 호텔 사전: "도시+호텔명" 정규화 키로 정보 보관 */
function loadLib(){try{const r=localStorage.getItem(LIBKEY);if(r)return JSON.parse(r);}catch(e){}return{};}
function saveLib(lib){try{localStorage.setItem(LIBKEY,JSON.stringify(lib));}catch(e){}}
function normKey(city,name){
  const n=(s)=>(s||'').toLowerCase().replace(/[\s\-_.,'"()]/g,'').replace(/hotel|호텔/g,'');
  return n(city)+'|'+n(name);
}
/* 과거 일정표에서 추출한 호텔명 시드 (최초 1회 주입, 학습 출발점) */
const SEED_HOTELS={
  '이스탄불':['PULLMAN','CROWNE PLAZA HARBIYE','SHERATON ATAKOY','CHIRAGAN PALACE KEMPINSKI','DELTA ISTANBUL WEST','WANDA VISTA','MARRIOTT PENDIK','SHERATON ISTANBUL ESENYURT'],
  '앙카라':['NEWPARK ANKARA','GRAND ANKARA HOTEL'],
  '카파도키아':['ORTAHISAR KAYA','ORTAHISAR CAVE','DOUBLETREE BY HILTON AVANOS','ALP','CRYSTAL KAYMAKLI','SUHAN','PERISSIA'],
  '아피온':['NG AFYON'],
  '콘야':['NOVOTEL KONYA','GRAND KONYA','RAMADA KONYA','BAYIR DIAMOND'],
  '안탈리아':['HOLIDAY INN LARA','DOUBLETREE BY HILTON ANTALYA'],
  '파묵칼레':['ADEM PIRA','LYCUS','RICHMOND','DOGA THERMAL','RENEX'],
  '이즈미르':['KAYA IZMIR THERMAL'],
  '쿠샤다스':['RAMADA SUIT'],
  '부르사':['BAIA BURSA'],

let ocrCandidates=[];

/* OCR 결과 텍스트에서 호텔명 후보 뽑기 */
/* 사전(학습)에 저장된 호텔명 목록 */
function knownHotelNames(){
  const lib=loadLib();const names=[];
  Object.keys(lib).forEach(k=>{if(lib[k]&&lib[k].name)names.push(lib[k].name);});
  return names;
}
/* 비교용 정규화 */
function normName(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}

/* 알려진 호텔 브랜드 */
const HOTEL_BRANDS=['PULLMAN','HILTON','HOLIDAY INN','GREEN PARK','RAMADA','RADISSON','SHERATON','MARRIOTT','NOVOTEL','MERCURE','IBIS','CROWNE PLAZA','WYNDHAM','DOUBLETREE','DEDEMAN','DIVAN','RIXOS','HYATT','HILTON GARDEN','CONRAD','SWISSOTEL','MOVENPICK','KAYA','LIMAK','TITANIC','ELITE WORLD','POINT','GRAND','PALACE','RESORT','SUITES'];

function extractHotelCandidates(text){
  const rawLines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const fullUpper=text.toUpperCase();
  const found=[];const seen=new Set();
  const push=(name,score)=>{const key=normName(name);if(key.length<3||seen.has(key))return;seen.add(key);found.push({name:name.trim().replace(/\s+/g,' '),score});};

  // 1순위: 학습된(사전에 저장된) 호텔명이 텍스트에 보이면 최우선
  knownHotelNames().forEach(kn=>{
    const nk=normName(kn);
    if(nk.length>=3 && normName(text).includes(nk))push(kn,100);
  });

  // 2순위: 알려진 브랜드명
  HOTEL_BRANDS.forEach(b=>{
    const re=new RegExp(b.replace(/\s+/g,'\\s*'),'i');
    if(re.test(text))push(b,80);
  });

  // 3순위: 줄 단위로 호텔명다운 토큰 추출 (노이즈 강력 필터)
  const STOP=/^(HOTEL|LUNCH|DINNER|DATE|CODE|PAX|COACH|ROOM|TYPE|STEP|NOTICE|ITINERARY|RESTAURANT|SCHEDULE|DESTINATION|BOOKING|SHEET|AIRLINE|CAFE|REST|TUR|TOUR|KEBOB|KEBAB|PARK|CLOSED|OPEN|MON|TUE|WED|THU|FRI|SAT|SUN|EURO|PAM|KAPA|SAFARI|BALON|MUSEUM|MOZESI|SARAYI|PALACE|MOSQUE|BAZAR|BAZAAR|CRUISE|PALAS)$/;
  const tokenRe=/\b([A-Z][A-Za-z]{2,}(?:\s+[A-Z][A-Za-z]{2,}){0,2})\b/g;
  rawLines.forEach(line=>{
    if(line.length>34)return;            // 설명문 제외
    if(/[가-힣]/.test(line))return;       // 한글 섞인 줄 제외(메뉴·관광지)
    if(/\d{2}[:.]\d{2}/.test(line))return;// 시간 줄 제외
    let m;
    while((m=tokenRe.exec(line))!==null){
      const cand=m[1].trim();const up=cand.toUpperCase();
      const words=cand.split(/\s+/);
      // 노이즈 필터: 한 단어인데 4글자 미만이면 제외(XIX, YEE, AHF 등 컷)
      if(words.length===1 && cand.length<5)continue;
      // 각 단어가 STOP 단어면 제외
      if(words.some(w=>STOP.test(w.toUpperCase())))continue;
      // 모음이 하나도 없는 자음 덩어리(SCT 등) 제외
      if(!/[AEIOU]/i.test(cand))continue;
      // 같은 글자 3연속 등 비정상 제외
      if(/(.)\1\1/i.test(cand))continue;
      let score=words.length>=2?60:35;   // 2단어 이상이면 호텔명일 확률↑
      push(cand,score);
    }
  });

  // 점수 높은 순 정렬
  found.sort((a,b)=>b.score-a.score);
  return found;
}

function startOcr(dataUrl){
  openOcrModal();
  const body=document.getElementById('ocrBody');const sub=document.getElementById('ocrSub');
  sub.textContent='사진을 분석하고 있어요... (10~30초 정도 걸려요)';
  body.innerHTML='<div class="ocr-status">🔍 글자를 읽는 중...<div class="ocr-bar"><i id="ocrProg"></i></div></div>';
  if(typeof Tesseract==='undefined'){
    sub.textContent='OCR 모듈을 불러오지 못했어요 (인터넷 연결 확인)';
    showManualOnly();return;
  }
  Tesseract.recognize(dataUrl,'eng',{logger:m=>{if(m.status==='recognizing text'){const p=document.getElementById('ocrProg');if(p)p.style.width=Math.round(m.progress*100)+'%';}},tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz 0123456789'})
    .then(({data})=>{
      const cands=extractHotelCandidates(data.text||'');
      showCandidates(cands);
    })
    .catch(()=>{document.getElementById('ocrSub').textContent='분석에 실패했어요. 직접 입력해 주세요.';showManualOnly();});
}

function showCandidates(cands){
  // 학습/브랜드(점수 high)는 기본 체크, 그 외 추정은 체크 해제 상태로
  ocrCandidates=cands.map(c=>({name:c.name,city:guessCity(c.name),sel:c.score>=60}));
  const body=document.getElementById('ocrBody');const sub=document.getElementById('ocrSub');
  const high=ocrCandidates.filter(c=>c.sel).length;
  if(ocrCandidates.length===0){
    sub.textContent='호텔명을 자동으로 찾지 못했어요. 아래에서 직접 입력해 주세요.';
  }else{
    sub.textContent='호텔 후보예요. 체크된 항목이 신뢰도 높은 것 ('+high+'/'+ocrCandidates.length+'개) · 맞는 것만 남기세요';
  }
  renderCandidates();
  document.getElementById('ocrFoot').style.display='flex';
}

}

      '<div class="field"><label>📝 메모</label><textarea data-f="notes" placeholder="특이사항, 픽업 위치...">'+escapeHtml(h.notes)+'</textarea></div>'+
      '<button class="guestcopy" data-act="copyguest">📤 고객 안내문 복사 (카카오톡 붙여넣기)</button>'+
      '<div class="card-actions"><button class="save-btn" data-act="savecard">✓ 저장하고 닫기</button><button class="del-btn" data-act="delete">🗑 삭제</button></div>'+
    '</div>';
  return c;
}
function escapeHtml(s){return(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escapeAttr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

document.getElementById('btnSchedule').onclick=()=>document.getElementById('schedInput').click();
document.getElementById('uploadZone').addEventListener('click',e=>{if(e.target.dataset.act==='rmsched'){state.schedule=null;save();render();}});
document.getElementById('btnManual').onclick=addHotel;
document.getElementById('fabAdd').onclick=addHotel;
document.getElementById('sortSel').onchange=e=>{sortMode=e.target.value;render();};

/* ===== 백업 / 복원 ===== */
document.getElementById('btnBackup').onclick=function(){
  const data={version:1,exportedAt:new Date().toISOString(),notes:state,library:loadLib()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();const stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href=url;a.download='투어호텔노트_백업_'+stamp+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('백업 파일을 저장했어요 💾');
};
document.getElementById('btnRestore').onclick=function(){document.getElementById('restoreInput').click();};
document.getElementById('restoreInput').onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data||!data.notes||!Array.isArray(data.notes.hotels))throw new Error('형식 오류');
      const cur=state.hotels.length;const lib=loadLib();const libCur=Object.keys(lib).length;
      if(!confirm('복원하면 현재 데이터에 백업 내용이 합쳐집니다.\n\n현재 호텔 '+cur+'곳 / 사전 '+libCur+'곳\n백업 호텔 '+data.notes.hotels.length+'곳 / 사전 '+Object.keys(data.library||{}).length+'곳\n\n진행할까요?'))return;
      // 호텔 목록: id 기준 중복 제거 후 병합
      const ids=new Set(state.hotels.map(h=>h.id));
      data.notes.hotels.forEach(h=>{if(!ids.has(h.id))state.hotels.push(h);});
      if(!state.schedule&&data.notes.schedule)state.schedule=data.notes.schedule;
      // 사전 병합 (백업이 더 최신이면 갱신)
      const merged=loadLib();const bl=data.library||{};
      Object.keys(bl).forEach(k=>{if(!merged[k]||(bl[k].savedAt||0)>(merged[k].savedAt||0))merged[k]=bl[k];});
      saveLib(merged);
      save();render();
      toast('복원 완료 ✓ 호텔·사전이 합쳐졌어요');
    }catch(err){alert('복원 실패: 올바른 백업 파일이 아니에요.');}
  };
  fr.readAsText(f);e.target.value='';
};
document.getElementById('cityChips').addEventListener('click',e=>{const ch=e.target.closest('.chip');if(ch){filterCity=ch.dataset.city;render();}});
document.getElementById('typeTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){filterType=b.dataset.type;render();}});

/* OCR 모달 이벤트 */
document.getElementById('ocrModal').addEventListener('click',e=>{
  if(e.target.id==='ocrModal'){closeOcrModal();return;}
  const cand=e.target.closest('.cand');
  if(cand){const i=+cand.dataset.ci;ocrCandidates[i].sel=!ocrCandidates[i].sel;renderCandidates();return;}
  const act=e.target.closest('[data-act]')?e.target.closest('[data-act]').dataset.act:null;
  if(act==='manualadd'){const inp=document.getElementById('manualName');const v=inp.value.trim();if(v){ocrCandidates.push({name:v,city:guessCity(v),sel:true});renderCandidates();}return;}
  if(act==='ocrcancel'){closeOcrModal();return;}
  if(act==='ocradd'){
    const picks=ocrCandidates.filter(c=>c.sel);
    if(picks.length===0){toast('선택된 호텔이 없어요');return;}
    let day=state.hotels.length;let autoCnt=0;
    picks.forEach(c=>{day++;const h=blankHotel(c.name,'Day '+day,c.city);if(filterType!=='전체')h.types=[filterType];if(libFill(h)>0)autoCnt++;state.hotels.push(h);});
    save();render();closeOcrModal();
    toast(picks.length+'개 추가'+(autoCnt?' · '+autoCnt+'곳 정보 자동 불러옴 ✓':' ✓'));
    return;
  }
});

function addHotel(){const h=blankHotel('','Day '+(state.hotels.length+1),filterCity!=='전체'?filterCity:'');if(filterType!=='전체')h.types=[filterType];h._open=true;state.hotels.push(h);save();render();setTimeout(()=>{const el=document.querySelector('[data-id="'+h.id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},80);}
document.getElementById('schedInput').onchange=function(e){const f=e.target.files[0];if(!f)return;resizeImage(f,1400,d=>{state.schedule=d;save();render();setTimeout(startOcrFromSchedule,150);});e.target.value='';};
document.getElementById('photoInput').onchange=function(e){const files=[...e.target.files];if(!files.length||!activePhotoHotel)return;const h=state.hotels.find(x=>x.id===activePhotoHotel);if(!h)return;let done=0;files.forEach(f=>resizeImage(f,900,d=>{h.photos.push(d);done++;if(done===files.length){save();render();reopenAndScroll(h.id);}}));e.target.value='';};

document.getElementById('list').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const h=state.hotels.find(x=>x.id===card.dataset.id);if(!h)return;
  const actEl=e.target.closest('[data-act]');const act=actEl?actEl.dataset.act:null;
  if(act==='copyguest'){copyGuest(h,actEl);return;}
  if(act==='openmap'){
    if(!h.name){toast('호텔명을 먼저 입력해 주세요');return;}
    const cityEn=CITY_EN[h.city]||h.city||'';
    const q=encodeURIComponent(h.name+' '+cityEn+' Turkey');
    window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank');
    return;
  }
  if(act==='savecard'){libStore(h);save();h._open=false;render();toast('저장되었습니다 ✓ (호텔 사전에 기록)');return;}
  if(act==='toggle'){h._open=!h._open;card.classList.toggle('open');return;}
  if(act==='delete'){if(confirm('이 호텔을 삭제할까요?')){state.hotels=state.hotels.filter(x=>x.id!==h.id);save();render();}return;}
  if(act==='addphoto'){activePhotoHotel=h.id;document.getElementById('photoInput').click();return;}
  if(act==='rmphoto'){h.photos.splice(+e.target.dataset.pi,1);save();render();reopenAndScroll(h.id);return;}
  const tp=e.target.closest('.tp');
  if(tp){const t=tp.dataset.type;if(!Array.isArray(h.types))h.types=[];const i=h.types.indexOf(t);if(i>=0)h.types.splice(i,1);else h.types.push(t);save();render();reopenAndScroll(h.id);return;}
  const tg=e.target.closest('.tg');
  if(tg){const grp=tg.closest('[data-grp]').dataset.grp;const val=tg.dataset.val==='yes';h[grp]=(h[grp]===val)?null:val;save();render();reopenAndScroll(h.id);}
});
document.getElementById('list').addEventListener('change',e=>{if(e.target.dataset.f==='city'){const card=e.target.closest('.card');const h=state.hotels.find(x=>x.id===card.dataset.id);if(h){h.city=e.target.value;const n=libFill(h);save();render();reopenAndScroll(h.id);if(n>0)toast('저장된 정보 '+n+'건 자동 불러옴 ✓');}}});
let saveTimer;
document.getElementById('list').addEventListener('input',e=>{const f=e.target.dataset.f;if(!f||f==='city')return;const card=e.target.closest('.card');const h=state.hotels.find(x=>x.id===card.dataset.id);if(!h)return;h[f]=e.target.value;if(f==='name')card.querySelector('.hname').textContent=h.name||'(호텔명 미입력)';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(state));flash();},500);});
function reopenAndScroll(id){const h=state.hotels.find(x=>x.id===id);if(h)h._open=true;render();setTimeout(()=>{const el=document.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'});},50);}
function resizeImage(file,maxW,cb){const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{let w=img.width,hh=img.height;if(w>maxW){hh=hh*maxW/w;w=maxW;}const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);cb(cv.toDataURL('image/jpeg',0.72));};img.src=fr.result;};fr.readAsDataURL(file);}
render();
if('serviceWorker' in navigator){const sw='const C="tourhotel-v3";self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});';const blob=new Blob([sw],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});}
</script>
