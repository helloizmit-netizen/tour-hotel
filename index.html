<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>투어 호텔 노트</title>
<style>
  :root{
    --bg:#0a0e12;--surface:#121a21;--surface2:#0e151b;--line:#26323d;
    --text:#e8eef3;--muted:#8499a8;--accent:#e8a33d;--accent2:#3da6e8;
    --green:#46c98a;--red:#e06650;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:radial-gradient(900px 500px at 90% -10%, rgba(232,163,61,.10), transparent 60%),radial-gradient(700px 500px at -10% 110%, rgba(61,166,232,.08), transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px;margin:0;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(10,14,18,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 0 12px;margin-bottom:4px;}
  .topbar .row{display:flex;align-items:center;gap:12px;}
  .logo{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#1c2630,#0c1217);display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(232,163,61,.18);}
  .ttl{flex:1;}
  .ttl h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .ttl p{margin:2px 0 0;font-size:11.5px;color:var(--muted);}
  .pill{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;}
  .section-title{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 10px;}
  .searchbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;padding:13px 15px;outline:none;}
  .searchbox:focus{border-color:var(--accent2);}
  .citychips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
  .citychips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer;transition:.15s;}
  .chip.active{background:rgba(61,166,232,.15);border-color:var(--accent2);color:var(--accent2);}
  .chip .n{font-size:10px;opacity:.7;margin-left:4px;}
  /* 호텔 목록 항목 */
  .hotel-item{display:flex;align-items:center;gap:12px;padding:15px;background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;margin-bottom:11px;cursor:pointer;transition:.15s;}
  .hotel-item:active{transform:scale(.99);}
  .hotel-item .hi-ic{width:46px;height:46px;border-radius:12px;background:rgba(232,163,61,.13);display:grid;place-items:center;font-size:22px;flex-shrink:0;}
  .hotel-item .hi-meta{flex:1;min-width:0;}
  .hotel-item .hi-name{font-size:15.5px;font-weight:700;line-height:1.3;}
  .hotel-item .hi-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .hotel-item .hi-city{color:var(--accent);}
  .hotel-item .hi-badge{background:rgba(224,102,80,.15);color:var(--red);font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;padding:0 6px;flex-shrink:0;}
  .hotel-item .hi-chev{color:var(--muted);font-size:18px;}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;}
  .empty .ic{font-size:40px;margin-bottom:12px;opacity:.5;}
  .empty p{font-size:13.5px;line-height:1.6;margin:0;}
  .addbtn{width:100%;padding:14px;border-radius:13px;border:1px dashed rgba(61,166,232,.4);background:rgba(61,166,232,.07);color:var(--accent2);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;margin:6px 0 14px;}
  /* 상세 */
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);font-size:13.5px;font-weight:600;cursor:pointer;margin:16px 0 6px;background:none;border:none;font-family:inherit;padding:4px 0;}
  .detail-head{display:flex;align-items:flex-start;gap:12px;padding:16px;background:linear-gradient(135deg,rgba(232,163,61,.1),rgba(61,166,232,.05));border:1px solid var(--line);border-radius:14px;margin-bottom:6px;}
  .detail-head .dh-ic{font-size:26px;}
  .detail-head .dh-name{font-size:18px;font-weight:800;flex:1;background:none;border:none;color:var(--text);font-family:inherit;width:100%;outline:none;padding:0;}
  .detail-head .dh-name:focus{border-bottom:1px solid var(--accent2);}
  .summary-row{display:flex;gap:10px;margin:12px 0;}
  .summary-box{flex:1;text-align:center;background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:13px;padding:14px 8px;}
  .summary-box .num{font-size:23px;font-weight:800;}
  .summary-box .lab{font-size:11px;color:var(--muted);margin-top:3px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:11px 13px;outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2);}
  .field textarea{resize:vertical;min-height:46px;line-height:1.5;}
  .two{display:flex;gap:10px;}
  .two .field{flex:1;}
  .card-block{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px;}
  .card-block > h3{margin:0 0 13px;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
  .toggle-row{display:flex;gap:8px;}
  .tg{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
  .tg.on{background:rgba(70,201,138,.14);border-color:var(--green);color:var(--green);}
  .tg.off{background:rgba(224,102,80,.12);border-color:var(--red);color:var(--red);}
  /* 사진 */
  .photos{display:flex;gap:8px;flex-wrap:wrap;}
  .photo{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo img{width:100%;height:100%;object-fit:cover;}
  .photo .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center;}
  .addphoto{width:72px;height:72px;border-radius:10px;border:1px dashed var(--line);background:var(--surface);color:var(--muted);font-size:24px;cursor:pointer;display:grid;place-items:center;}
  .mapbtn{width:100%;padding:12px;border-radius:11px;border:1px solid rgba(61,166,232,.45);background:rgba(61,166,232,.12);color:var(--accent2);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:4px;}
  /* 방문 기록 */
  .visit-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .visit-item .vi-date{flex:1;font-size:14px;font-weight:600;}
  .visit-item .vi-claims{font-size:11.5px;color:var(--accent);}
  .visit-item .vi-del{background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;}
  .visit-add-row{display:flex;gap:8px;margin-top:4px;}
  .visit-add-row input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:11px;outline:none;}
  .visit-add-row button{padding:0 18px;border-radius:10px;border:none;background:var(--accent2);color:#04141f;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  /* 클레임 */
  .claim-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .claim-row{display:flex;gap:8px;}
  .claim-row input,.claim-row select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;}
  .claim-room{width:84px;}.claim-type{flex:1;}
  .claim-del{background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;padding:0 4px;}
  .claim-memo{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;resize:vertical;min-height:36px;}
  .claim-add{width:100%;padding:9px;border-radius:9px;border:1px dashed rgba(61,166,232,.4);background:rgba(61,166,232,.07);color:var(--accent2);font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;}
  .claim-date{font-size:11px;color:var(--muted);font-weight:700;margin:14px 0 7px;}
  /* 통계 */
  .stat-card{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .stat-card h3{margin:0 0 12px;font-size:14px;}
  .stat-bar{margin-bottom:10px;}
  .stat-bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .stat-bar .lab b{color:var(--accent);}
  .stat-bar .track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .stat-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;}
  .hist-item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;}
  .hist-top{display:flex;align-items:center;gap:8px;}
  .hist-type{font-size:12px;font-weight:700;color:var(--accent);background:rgba(232,163,61,.12);padding:3px 9px;border-radius:6px;}
  .hist-room{font-size:11.5px;color:var(--accent2);font-weight:600;}
  .hist-meta{font-size:11px;color:var(--muted);margin-top:5px;}
  .hist-memo{font-size:13px;margin-top:6px;line-height:1.5;}
  .stat-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px;}
  .backupbar{display:flex;gap:10px;margin:6px 0 14px;}
  .backupbar button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:var(--text);font-family:inherit;font-size:13px;padding:13px;cursor:pointer;}
  .delbtn{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid rgba(224,102,80,.5);background:rgba(224,102,80,.14);color:#ff8a72;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;}
  /* 하단 탭 */
  .bottomtabs{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;background:rgba(14,20,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);max-width:560px;margin:0 auto;}
  .bottomtabs button{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);padding:9px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .bottomtabs button .bi{font-size:21px;}
  .bottomtabs button.active{color:var(--accent);}
  .flash{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#03210f;font-size:13px;font-weight:700;padding:9px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:80;white-space:nowrap;}
  .flash.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="row">
      <div class="logo">🏨</div>
      <div class="ttl"><h1>투어 호텔 노트</h1><p>Emre 가이드 전용 · 호텔 데이터베이스</p></div>
      <div class="pill" id="countPill">0곳</div>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- 호텔 검색 뷰 -->
  <div id="viewHotels">
    <input id="searchInput" class="searchbox" placeholder="🔍 호텔명 또는 도시 검색">
    <div class="citychips" id="cityChips"></div>
    <button class="addbtn" id="btnAddHotel">＋ 새 호텔 추가</button>
    <div id="hotelList"></div>
  </div>
  <!-- 상세 뷰 -->
  <div id="viewDetail" style="display:none"></div>
  <!-- 통계 뷰 -->
  <div id="viewStats" style="display:none"></div>
  <!-- 백업 뷰 -->
  <div id="viewBackup" style="display:none">
    <div class="section-title">데이터 백업</div>
    <div class="backupbar">
      <button id="btnBackup">💾 백업 저장</button>
      <button id="btnRestore">📥 복원</button>
    </div>
    <p style="font-size:12px;color:var(--muted);line-height:1.6">백업 파일을 카톡 '나에게 보내기'나 클라우드에 보관해 두면 안전해요. 휴대폰을 바꾸거나 데이터가 사라져도 복원할 수 있어요.</p>
  </div>
</div>

<div class="bottomtabs" id="bottomTabs">
  <button data-view="hotels" class="active"><span class="bi">🏨</span>호텔</button>
  <button data-view="stats"><span class="bi">📊</span>통계</button>
  <button data-view="backup"><span class="bi">💾</span>백업</button>
</div>

<div class="flash" id="flash"></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

<script>
/* ===================== 상수 ===================== */
const CITIES=['이스탄불','앙카라','부르사','이즈미르','쿠샤다스','파묵칼레','카파도키아','콘야','안탈리아','아피온','아이발륵'];
const CITY_EN={'이스탄불':'Istanbul','앙카라':'Ankara','부르사':'Bursa','이즈미르':'Izmir','쿠샤다스':'Kusadasi','파묵칼레':'Pamukkale','카파도키아':'Cappadocia','콘야':'Konya','안탈리아':'Antalya','아피온':'Afyon','아이발륵':'Ayvalik'};
const CLAIM_TYPES=['객실 문제','냉/난방 문제','화장실 문제','음식 문제','기타 시설 문제'];
const DBKEY='tour_hotel_db_v1';
const OLDKEY='tour_hotel_notes_v3';     // 구버전 호텔 목록
const LIBKEY='tour_hotel_library_v1';   // 구버전 사전
const SEEDFLAG='tour_hotel_db_seed_v1';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function normName(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normKey(city,name){const n=(s)=>(s||'').toLowerCase().replace(/[\s\-_.,'"()]/g,'').replace(/hotel|호텔/g,'');return n(city)+'|'+n(name);}
function escapeHtml(s){return(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escapeAttr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function flash(msg){const f=document.getElementById('flash');f.textContent=msg||'저장됨 ✓';f.classList.add('show');setTimeout(()=>f.classList.remove('show'),msg?2200:1000);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

/* 시드 호텔 (도시+이름+주소) */
const SEED_HOTELS={
  '이스탄불':['PULLMAN','CROWNE PLAZA HARBIYE','SHERATON ATAKOY','CHIRAGAN PALACE KEMPINSKI','DELTA ISTANBUL WEST','WANDA VISTA','MARRIOTT PENDIK','SHERATON ISTANBUL ESENYURT'],
  '앙카라':['NEWPARK ANKARA','GRAND ANKARA HOTEL','GREEN PARK'],
  '카파도키아':['ORTAHISAR CAVE','DOUBLETREE BY HILTON AVANOS','ALP','CRYSTAL KAYMAKLI','SUHAN','PERISSIA','NUJELM','HANEDAN CAPPADOCIA SUITES'],
  '아피온':['NG AFYON'],
  '콘야':['NOVOTEL KONYA','GRAND KONYA','RAMADA KONYA','BAYIR DIAMOND'],
  '안탈리아':['HOLIDAY INN LARA','DOUBLETREE BY HILTON ANTALYA'],
  '파묵칼레':['ADEM PIRA','LYCUS','RICHMOND','DOGA THERMAL','RENEX'],
  '이즈미르':['KAYA IZMIR THERMAL'],
  '쿠샤다스':['RAMADA SUIT'],
  '부르사':['BAIA BURSA'],
  '아이발륵':['GRAND TEMIZEL']
};
const SEED_ADDR={};
SEED_ADDR[normKey('카파도키아','HANEDAN CAPPADOCIA SUITES')]='Yukarı mevki Şehit Ramazan Çelik Sk. Mustafapaşa, Ürgüp, Nevşehir / Türkiye, 50420';

/* ===================== 데이터 모델 ===================== */
/* hotel = {id,name,city,address,wifiSsid,wifiId,wifiPw,breakfast,dinner,structure,lobbyBtn,elevator,alcohol,notes,photos[],visits[],claims[]}
   visit = {id,date}
   claim = {id,date,room,type,memo}  (date = 방문 날짜와 연결되거나 자유) */
function blankHotel(name,city){return{id:uid(),name:name||'',city:city||'',address:'',wifiSsid:'',wifiId:'',wifiPw:'',breakfast:'',dinner:'',structure:'',lobbyBtn:'',elevator:null,alcohol:null,notes:'',photos:[],visits:[],claims:[]};}

let DB={hotels:[]};
function loadDB(){try{const r=localStorage.getItem(DBKEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function saveDB(){try{localStorage.setItem(DBKEY,JSON.stringify(DB));flash();}catch(e){alert('저장 실패: 저장 공간이 부족할 수 있어요.');}}

/* ===================== 마이그레이션 ===================== */
function migrateFromOld(){
  // 구버전 호텔 목록 + 사전을 호텔 DB로 편입
  const byKey={};  // normKey -> hotel
  const ensure=(name,city)=>{
    const k=normKey(city,name);
    if(!byKey[k]){const h=blankHotel(name,city);byKey[k]=h;}
    return byKey[k];
  };
  // 1) 사전(library) 먼저 → 고정 정보 + 시드
  try{
    const lib=JSON.parse(localStorage.getItem(LIBKEY)||'{}');
    Object.keys(lib).forEach(k=>{
      const r=lib[k];if(!r||!r.name||!r.city)return;
      const h=ensure(r.name,r.city);
      ['address','wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn'].forEach(f=>{if(r[f]&&!h[f])h[f]=r[f];});
      if(h.elevator===null&&r.elevator!==undefined&&r.elevator!==null)h.elevator=r.elevator;
      if(h.alcohol===null&&r.alcohol!==undefined&&r.alcohol!==null)h.alcohol=r.alcohol;
      if(r.notes&&!h.notes)h.notes=r.notes;
      if(r.photos&&r.photos.length&&h.photos.length===0)h.photos=r.photos.slice();
    });
  }catch(e){}
  // 2) 구버전 호텔 목록(notes) → 고정 정보 보강 + 방문/클레임 누적
  try{
    const old=JSON.parse(localStorage.getItem(OLDKEY)||'{}');
    const tours=Array.isArray(old.tours)?old.tours:[];
    const tourName=(id)=>{const t=tours.find(x=>x.id===id);return t?t.name:'';};
    (old.hotels||[]).forEach(o=>{
      if(!o.name)return;
      const h=ensure(o.name,o.city||'');
      // 고정 정보(빈 곳만 채움)
      ['address','wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn'].forEach(f=>{if(o[f]&&!h[f])h[f]=o[f];});
      if(h.elevator===null&&o.elevator!==undefined&&o.elevator!==null)h.elevator=o.elevator;
      if(h.alcohol===null&&o.alcohol!==undefined&&o.alcohol!==null)h.alcohol=o.alcohol;
      if(o.notes&&o.notes.length>(h.notes||'').length)h.notes=o.notes;
      if(o.photos&&o.photos.length){o.photos.forEach(p=>{if(h.photos.indexOf(p)<0&&h.photos.length<8)h.photos.push(p);});}
      // 방문 기록: 투어가 있으면 투어 1개당 방문 1개 (날짜는 투어 생성일 추정 불가 → 미상)
      // 클레임 누적
      (o.claims||[]).forEach(cl=>{
        if(!cl||(!cl.room&&!cl.type&&!cl.memo))return;
        h.claims.push({id:uid(),date:'',room:cl.room||'',type:(cl.type||'').trim()||'기타',memo:cl.memo||''});
      });
    });
  }catch(e){}
  // 3) 시드 주소 보강
  Object.keys(SEED_ADDR).forEach(k=>{if(byKey[k]&&!byKey[k].address)byKey[k].address=SEED_ADDR[k];});
  // 4) 시드에 있는데 아직 없는 호텔 추가
  Object.keys(SEED_HOTELS).forEach(city=>{SEED_HOTELS[city].forEach(name=>{ensure(name,city);});});

  DB={hotels:Object.values(byKey)};
  localStorage.setItem(DBKEY,JSON.stringify(DB));
  localStorage.setItem(SEEDFLAG,'1');
}

let mainView='hotels';

let search='';
let filterCity='전체';

function hotelById(id){return DB.hotels.find(h=>h.id===id);}
function setTab(){document.querySelectorAll('#bottomTabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===mainView));}
function debouncedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(DBKEY,JSON.stringify(DB));flash();},500);}

function render(){

/* ---------- 호텔 목록 ---------- */
function cityCounts(){const c={};DB.hotels.forEach(h=>{if(h.city)c[h.city]=(c[h.city]||0)+1;});return c;}
function renderChips(){
  const box=document.getElementById('cityChips');const counts=cityCounts();

  CITIES.forEach(c=>{const n=counts[c]||0;if(!n&&filterCity!==c)return;html+='<div class="chip '+(filterCity===c?'active':'')+'" data-city="'+c+'">'+c+(n?'<span class="n">'+n+'</span>':'')+'</div>';});
  box.innerHTML=html;
}
function visibleHotels(){
  let arr=DB.hotels.slice();
  if(search.trim()){const q=search.trim().toLowerCase();arr=arr.filter(h=>(h.name||'').toLowerCase().includes(q)||(h.city||'').toLowerCase().includes(q));}
  if(filterCity!=='전체')arr=arr.filter(h=>h.city===filterCity);
  arr.sort((a,b)=>(b.claims.length-a.claims.length)||(b.visits.length-a.visits.length)||(a.name||'').localeCompare(b.name||'','ko'));
  return arr;
}
function renderHotels(){
  renderChips();
  const list=document.getElementById('hotelList');
  const vis=visibleHotels();
  if(vis.length===0){list.innerHTML='<div class="empty"><div class="ic">🔍</div><p>'+(search.trim()||filterCity!=='전체'?'해당하는 호텔이 없어요.':'아직 호텔이 없어요.<br>+ 새 호텔 추가로 등록하세요.')+'</p></div>';return;}
  list.innerHTML=vis.map(h=>{

    sub.push('방문 '+h.visits.length+'회');

/* ---------- 통계 ---------- */
function renderStats(){
  const vs=document.getElementById('viewStats');
  const byType={};let total=0;const hotelClaim=[];
  DB.hotels.forEach(h=>{
    if(h.claims.length)hotelClaim.push({name:h.name,city:h.city,n:h.claims.length,visits:h.visits.length});
    h.claims.forEach(c=>{total++;const t=(c.type||'기타').trim()||'기타';byType[t]=(byType[t]||0)+1;});
  });
  const totalVisits=DB.hotels.reduce((s,h)=>s+h.visits.length,0);
  let html='<div class="section-title" style="margin-top:18px">전체 요약</div>';
  html+='<div class="summary-row"><div class="summary-box"><div class="num" style="color:var(--accent)">'+DB.hotels.length+'</div><div class="lab">호텔</div></div>'+
    '<div class="summary-box"><div class="num" style="color:var(--accent2)">'+totalVisits+'</div><div class="lab">총 방문</div></div>'+
    '<div class="summary-box"><div class="num" style="color:var(--red)">'+total+'</div><div class="lab">총 클레임</div></div></div>';
  if(total===0){vs.innerHTML=html+'<div class="stat-empty">아직 클레임 기록이 없어요.<br>호텔 상세에서 클레임을 추가하면 집계돼요.</div>';return;}
  html+='<div class="stat-card"><h3>📋 클레임 유형별</h3>';
  const mx=Math.max.apply(null,Object.values(byType));
  Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).forEach(t=>{const val=byType[t];html+='<div class="stat-bar"><div class="lab"><span>'+escapeHtml(t)+'</span><b>'+val+'건</b></div><div class="track"><div class="fill" style="width:'+Math.round(val/mx*100)+'%"></div></div></div>';});
  html+='</div>';
  html+='<div class="stat-card"><h3>🏨 호텔별 클레임</h3>';
  hotelClaim.sort((a,b)=>b.n-a.n);const hmx=hotelClaim[0].n;
  hotelClaim.forEach(hc=>{html+='<div class="stat-bar"><div class="lab"><span>'+escapeHtml(hc.name)+'</span><b>'+hc.n+'건</b></div><div class="track"><div class="fill" style="width:'+Math.round(hc.n/hmx*100)+'%"></div></div></div>';});
  html+='</div>';
  html+='<div class="stat-card"><h3>🕘 클레임 히스토리</h3>';
  const all=[];DB.hotels.forEach(h=>h.claims.forEach(c=>all.push({hotel:h.name,city:h.city,date:c.date,room:c.room,type:(c.type||'기타').trim()||'기타',memo:c.memo})));
  all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  all.forEach(it=>{html+='<div class="hist-item"><div class="hist-top"><span class="hist-type">'+escapeHtml(it.type)+'</span>'+(it.room?'<span class="hist-room">'+escapeHtml(it.room)+'호</span>':'')+'</div><div class="hist-meta">'+escapeHtml(it.hotel)+(it.date?' · '+escapeHtml(it.date):'')+'</div>'+(it.memo?'<div class="hist-memo">'+escapeHtml(it.memo)+'</div>':'')+'</div>';});
  html+='</div>';
  vs.innerHTML=html;
}

document.getElementById('viewDetail').addEventListener('click',e=>{
  const actEl=e.target.closest('[data-act]');const act=actEl?actEl.dataset.act:null;
  const h=hotelById(detailId);if(!h)return;
  if(act==='back'){mainView='hotels';detailId=null;render();return;}
  if(act==='delhotel'){if(confirm('"'+(h.name||'이 호텔')+'"을(를) 삭제할까요?\n방문·클레임·사진·메모가 모두 사라집니다.')){DB.hotels=DB.hotels.filter(x=>x.id!==h.id);saveDB();mainView='hotels';detailId=null;render();}return;}
  const tg=e.target.closest('[data-tg]');
  if(tg){const f=tg.dataset.tg;const val=tg.dataset.v==='1';h[f]=(h[f]===val)?null:val;saveDB();renderDetail();return;}
  if(act==='addphoto'){activePhotoHotel=h.id;document.getElementById('photoInput').click();return;}
  if(act==='rmphoto'){h.photos.splice(+actEl.dataset.pi,1);saveDB();renderDetail();return;}
  if(act==='openmap'){
    if(!h.name&&!h.address){flash('호텔명이나 주소를 입력해 주세요');return;}
    let q;if(h.address&&h.address.trim())q=encodeURIComponent((h.name?h.name+' ':'')+h.address.trim());
    else{const en=CITY_EN[h.city]||h.city||'';q=encodeURIComponent(h.name+' '+en+' Turkey');}
    window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank');return;
  }
  if(act==='copyguest'){copyGuest(h);return;}
  if(act==='visitadd'){const d=document.getElementById('visitDate').value||todayStr();h.visits.push({id:uid(),date:d});saveDB();renderDetail();flash('방문 추가됨 ✓');return;}
  if(act==='visitdel'){const vid=actEl.dataset.vid;h.visits=h.visits.filter(v=>v.id!==vid);saveDB();renderDetail();return;}
  if(act==='claimadd'){
    const last=h.visits.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    h.claims.push({id:uid(),date:last?last.date:todayStr(),room:'',type:'',memo:''});saveDB();renderDetail();return;
  }
  if(act==='claimdel'){const idx=+e.target.closest('[data-idx]').dataset.idx;h.claims.splice(idx,1);saveDB();renderDetail();return;}
});

document.getElementById('viewDetail').addEventListener('input',e=>{

document.getElementById('photoInput').onchange=function(e){
  const files=[...e.target.files];if(!files.length||!activePhotoHotel)return;
  const h=hotelById(activePhotoHotel);if(!h)return;let done=0;
  files.forEach(f=>resizeImage(f,900,d=>{if(h.photos.length<8)h.photos.push(d);done++;if(done===files.length){saveDB();renderDetail();}}));
  e.target.value='';
};
function resizeImage(file,maxW,cb){const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{let w=img.width,hh=img.height;if(w>maxW){hh=hh*maxW/w;w=maxW;}const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);cb(cv.toDataURL('image/jpeg',0.72));};img.src=fr.result;};fr.readAsDataURL(file);}

function buildGuestMessage(h){
  const L=[];L.push('🏨 오늘의 숙소 안내');L.push('');L.push('● '+(h.name||''));
  if(h.wifiSsid||h.wifiPw){L.push('');L.push('📶 와이파이');if(h.wifiSsid)L.push('  - 와이파이 명: '+h.wifiSsid);if(h.wifiId)L.push('  - 아이디: '+h.wifiId);if(h.wifiPw)L.push('  - 비밀번호: '+h.wifiPw);}
  if(h.breakfast){L.push('');L.push('🍳 익일 조식 제공 시간  '+h.breakfast.split('~')[0].trim()+' 부터');}
  if(h.lobbyBtn){L.push('');L.push('🛗 로비층은 엘리베이터에서 ['+h.lobbyBtn+'] 버튼을 눌러주세요.');}
  L.push('');L.push('와이파이 접속이 어려우신 분들은 로비 또는 석식 시간에 제가 도움드리겠습니다.');
  return L.join('\n');
}
function copyGuest(h){const msg=buildGuestMessage(h);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(()=>flash('안내문 복사됨 ✓ 카톡에 붙여넣기')).catch(()=>fallbackCopy(msg));}else fallbackCopy(msg);}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('안내문 복사됨 ✓');}catch(e){alert(t);}document.body.removeChild(ta);}

  flash('백업 파일을 저장했어요 ✓');
};
document.getElementById('btnRestore').onclick=()=>document.getElementById('restoreInput').click();
document.getElementById('restoreInput').onchange=function(e){
  const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{
    const data=JSON.parse(fr.result);
    if(data.db&&Array.isArray(data.db.hotels)){
      if(!confirm('복원하면 현재 '+DB.hotels.length+'곳에 백업 '+data.db.hotels.length+'곳이 합쳐집니다.\n같은 호텔(도시+이름)은 방문·클레임이 합쳐져요.\n진행할까요?'))return;
      mergeHotels(data.db.hotels);saveDB();mainView='hotels';render();flash('복원 완료 ✓');
    }else if(data.notes){
      if(!confirm('구버전 백업이네요. 현재 데이터에 합칠까요?'))return;
      mergeOldBackup(data);saveDB();mainView='hotels';render();flash('구버전 백업 복원 완료 ✓');
    }else throw new Error('형식 오류');
  }catch(err){alert('복원 실패: 올바른 백업 파일이 아니에요.');}};
};
function mergeHotels(incoming){
  const idx={};DB.hotels.forEach(h=>idx[normKey(h.city,h.name)]=h);
  incoming.forEach(o=>{
    const k=normKey(o.city,o.name);const ex=idx[k];
    if(!ex){const nh=Object.assign(blankHotel(o.name,o.city),o);nh.id=uid();if(!Array.isArray(nh.visits))nh.visits=[];if(!Array.isArray(nh.claims))nh.claims=[];if(!Array.isArray(nh.photos))nh.photos=[];DB.hotels.push(nh);idx[k]=nh;}
    else{
      ['address','wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn'].forEach(f=>{if(o[f]&&!ex[f])ex[f]=o[f];});
      if(ex.elevator===null&&o.elevator!=null)ex.elevator=o.elevator;
      if(ex.alcohol===null&&o.alcohol!=null)ex.alcohol=o.alcohol;
      if(o.notes&&o.notes.length>(ex.notes||'').length)ex.notes=o.notes;
      (o.photos||[]).forEach(p=>{if(ex.photos.indexOf(p)<0&&ex.photos.length<8)ex.photos.push(p);});
      (o.visits||[]).forEach(v=>{if(!ex.visits.some(x=>x.date===v.date))ex.visits.push({id:uid(),date:v.date});});
      (o.claims||[]).forEach(c=>ex.claims.push({id:uid(),date:c.date||'',room:c.room||'',type:c.type||'기타',memo:c.memo||''}));
    }
  });
}
function mergeOldBackup(data){
  const incoming=[];const byKey={};
  const ensure=(name,city)=>{const k=normKey(city,name);if(!byKey[k]){byKey[k]=blankHotel(name,city);incoming.push(byKey[k]);}return byKey[k];};
  const lib=data.library||{};
  Object.keys(lib).forEach(k=>{const r=lib[k];if(!r||!r.name)return;const h=ensure(r.name,r.city||'');['address','wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn'].forEach(f=>{if(r[f]&&!h[f])h[f]=r[f];});if(r.photos&&r.photos.length&&!h.photos.length)h.photos=r.photos.slice();if(r.notes&&!h.notes)h.notes=r.notes;});
  (data.notes.hotels||[]).forEach(o=>{if(!o.name)return;const h=ensure(o.name,o.city||'');['address','wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn'].forEach(f=>{if(o[f]&&!h[f])h[f]=o[f];});if(o.notes&&o.notes.length>(h.notes||'').length)h.notes=o.notes;(o.photos||[]).forEach(p=>{if(h.photos.indexOf(p)<0&&h.photos.length<8)h.photos.push(p);});(o.claims||[]).forEach(c=>{if(c&&(c.room||c.type||c.memo))h.claims.push({id:uid(),date:'',room:c.room||'',type:(c.type||'기타').trim()||'기타',memo:c.memo||''});});});
  mergeHotels(incoming);
}

render();
</script>
