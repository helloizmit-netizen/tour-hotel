<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Emre 계산기</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Emre 계산기"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0a1628"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);}
    :root{--bg:#0a1628;--bg2:#1e293b;--bg3:#131f2e;--text:#f1f5f9;--sub:#64748b;--border:#334155;--card:#1e293b;}
    .light{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#e2e8f0;--text:#0f172a;--sub:#64748b;--border:#cbd5e1;--card:#ffffff;}
    input,button,textarea{font-family:'Noto Sans KR',sans-serif;}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);opacity:0.7;}
    ::-webkit-scrollbar{display:none;}
    #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;display:none;transition:opacity 0.3s;}
  </style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
// ── Emre 계산기 v6.0 - Pure JS (No JSX, No Babel) ──
const {useState,useEffect,useMemo,useRef,createElement:h}=React;

// ── Storage ──
const SK="emre-records",TK="emre-templates",SK_THEME="emre-theme",SK_GOAL="emre-goal",
      SK_BACKUP="emre-lastbackup",SK_SCORE_CFG="emre-score-cfg",SK_GROWTH="emre-growth-rate",
      SK_GOAL_MODE="emre-goal-mode";
const LEGACY=["emre-calc-v1","guide-income-records-v2","guide-income-records"];
function loadLS(key,def){try{const d=localStorage.getItem(key);if(d!=null)return JSON.parse(d);}catch{}return def;}
function saveLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}
function loadRecords(){
  try{const d=localStorage.getItem(SK);if(d)return JSON.parse(d);}catch{}
  for(const k of LEGACY){try{const d=localStorage.getItem(k);if(d){const p=JSON.parse(d);if(p&&p.length){saveLS(SK,p);localStorage.removeItem(k);return p;}}}catch{}}
  return[];
}

// ── Utils ──
function fmt(n,cur="EUR"){
  if(cur==="EUR")return"€"+Number(n||0).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:0});
  return"₩"+Number(n||0).toLocaleString("ko-KR");
}
function fmtDate(d){if(!d)return"";const[y,m,day]=d.split("-");return y+"."+m+"."+day;}
function monthKey(d){return d?d.slice(0,7):"";}
function pf(v){return parseFloat(v||0);}
function today(){return new Date().toISOString().slice(0,10);}
function clamp(v,min,max){return Math.min(Math.max(v,min),max);}
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;el.style.background=type==="err"?"#ef4444":"#10b981";el.style.color="#fff";
  el.style.display="block";el.style.opacity="1";
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.style.display="none",300);},2200);
}

// ── 마이그레이션 ──
function migrateRecord(r,idx){
  const u={...r};
  if(!u.extraOpt)u.extraOpt=[];if(!u.extraShop)u.extraShop=[];
  if(!u.extraTip)u.extraTip=[];if(!u.extraExp)u.extraExp=[];
  if(!u.optToggle)u.optToggle={balloon:true,jeep:true,kart:true,cruise:true};
  if(!u.expToggle)u.expToggle={istHotel:false};
  if(u.istHotel===undefined)u.istHotel="";
  if(!u.shopToggle)u.shopToggle={carpet:true,turquoise:true,cotton:true,leather:true,lokum:true};
  if(pf(r.optOther)>0){u.extraOpt=[...u.extraOpt,{id:r.id+1+idx,label:"기타",amount:String(r.optOther),pax:"",manualRate:""}];u.optOther="";}
  if(pf(r.otherIncome)>0){u.extraTip=[...u.extraTip,{id:r.id+2+idx,label:"기타수입",amount:String(r.otherIncome),pax:"",manualRate:""}];u.otherIncome="";}
  if(pf(r.expOther)>0){u.extraExp=[...u.extraExp,{id:r.id+3+idx,label:"기타",amount:String(r.expOther),pax:"",manualRate:""}];u.expOther="";}
  if(u.tipHoney===undefined)u.tipHoney="";if(u.tipMassage===undefined)u.tipMassage="";
  if(u.tipLamb===undefined)u.tipLamb="";if(u.tipWater===undefined)u.tipWater="";
  if(u.days===undefined)u.days="1";
  return u;
}

// ── Items ──
const OPT=[
  {key:"balloon",label:"🎈 열기구",rate:30,paxKey:"balloon_pax"},
  {key:"jeep",label:"🚙 지프 사파리",rate:20,paxKey:"jeep_pax"},
  {key:"kart",label:"🏎 카트",rate:10,paxKey:"kart_pax"},
  {key:"cruise",label:"⛵ 유람선",rate:10,paxKey:"cruise_pax"},
];
const TIP_FIXED=[
  {key:"tipHoney",label:"🍯 꿀"},{key:"tipMassage",label:"💆 마사지"},
  {key:"tipLamb",label:"🥩 양갈비"},{key:"tipWater",label:"💧 물값"},
];
const SHOP=[
  {key:"carpet",label:"🪄 카페트"},{key:"turquoise",label:"💎 터키석"},
  {key:"cotton",label:"👕 면제품"},{key:"leather",label:"🧥 양가죽"},{key:"lokum",label:"🍬 로쿰"},
];
const EXP=[{key:"snack",label:"🍿 주전부리"},{key:"drink",label:"🥤 음료"}];
const EXP_TOGGLE=[{key:"istHotel",label:"🏨 이스탄불 호텔"}];
function defExpTog(){return{istHotel:false};}
function defOptTog(){return Object.fromEntries(OPT.map(i=>[i.key,true]));}
function defShopTog(){return Object.fromEntries(SHOP.map(i=>[i.key,true]));}
function emptyForm(){
  return{date:today(),tourName:"",pax:"",days:"1",dailyWage:"",
    balloon:"",balloon_pax:"",jeep:"",jeep_pax:"",kart:"",kart_pax:"",cruise:"",cruise_pax:"",
    carpet:"",turquoise:"",cotton:"",leather:"",lokum:"",
    tip:"",tipHoney:"",tipMassage:"",tipLamb:"",tipWater:"",
    snack:"",drink:"",istHotel:"",memo:"",
    extraOpt:[],extraShop:[],extraTip:[],extraExp:[],
    optToggle:defOptTog(),shopToggle:defShopTog(),expToggle:defExpTog()};
}

// ── 수입 계산 ──
function tExtraOpt(r){return(r.extraOpt||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraShop(r){return(r.extraShop||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraTip(r){return(r.extraTip||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraExp(r){return(r.extraExp||[]).reduce((s,i)=>s+pf(i.amount),0);}
function sumKeys(r,keys){return keys.reduce((s,k)=>s+pf(r[k]),0);}
function tOpt(r){const t=r.optToggle||defOptTog();return OPT.filter(i=>t[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0)+tExtraOpt(r);}
function tShop(r){const t=r.shopToggle||defShopTog();return SHOP.filter(i=>t[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0)+tExtraShop(r);}
function tTip(r){return pf(r.tip)+sumKeys(r,TIP_FIXED.map(i=>i.key))+tExtraTip(r);}
function tExp(r){const et=r.expToggle||defExpTog();return sumKeys(r,EXP.map(i=>i.key))+(et.istHotel!==false?pf(r.istHotel):0)+tExtraExp(r);}
function tInc(r){return pf(r.dailyWage)+tOpt(r)+tShop(r)+tTip(r);}
function netEur(r){return tInc(r)-tExp(r);}
function ppNet(r){const p=parseInt(r.pax||0);return p>0?netEur(r)/p:0;}
function ppShop(r){const p=parseInt(r.pax||0);return p>0?tShop(r)/p:0;}

// ── 자동 목표 ──
function calcAutoGoals(records,growthRate=10){
  const sorted=[...records].filter(r=>parseInt(r.pax||0)>0).sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length)return{monthGoal:0,perPaxGoal:0};
  const now=new Date();
  const months=Array.from({length:3},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-1-i,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");});
  const recM=sorted.filter(r=>months.includes(monthKey(r.date)));
  const mAvg=recM.length>0?months.reduce((s,m)=>{const recs=recM.filter(r=>monthKey(r.date)===m);return s+(recs.length?recs.reduce((s2,r)=>s2+netEur(r),0):0);},0)/3:sorted.slice(0,10).reduce((s,r)=>s+netEur(r),0)/Math.min(sorted.length,10);
  const r10=sorted.slice(0,10);
  const avgPP=r10.length?r10.reduce((s,r)=>s+ppNet(r),0)/r10.length:0;
  const m=1+growthRate/100;
  return{monthGoal:Math.round(Math.max(mAvg,0)*m),perPaxGoal:Math.round(Math.max(avgPP,0)*m)};
}

// ── 약점 분석 ──
function analyzeWeakness(records,movingN=10){
  const sorted=[...records].filter(r=>parseInt(r.pax||0)>0&&pf(r.dailyWage)>0).sort((a,b)=>b.date.localeCompare(a.date));
  if(sorted.length<3)return[];
  const recent=sorted.slice(0,3),base=sorted.slice(3,3+movingN);
  if(!base.length)return[];
  const warns=[];
  const avgS=base.reduce((s,r)=>s+ppShop(r),0)/base.length;
  const recS=recent.reduce((s,r)=>s+ppShop(r),0)/recent.length;
  if(avgS>0&&recS<avgS*0.8)warns.push({msg:"최근 3투어 인당 쇼핑이 평균보다 "+Math.round((1-recS/avgS)*100)+"% 낮아요",color:"#a78bfa",emoji:"🛍"});
  const getOE=r=>{const tog=r.optToggle||defOptTog();const max=OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+i.rate*parseInt(r.pax||0),0);return max>0?tOpt(r)/max*100:0;};
  const avgOE=base.reduce((s,r)=>s+getOE(r),0)/base.length;
  const recOE=recent.reduce((s,r)=>s+getOE(r),0)/recent.length;
  if(avgOE>0&&recOE<avgOE*0.85)warns.push({msg:"최근 3투어 옵션 효율이 평균보다 "+Math.round((1-recOE/avgOE)*100)+"% 낮아요",color:"#fbbf24",emoji:"⭐"});
  const avgN=base.reduce((s,r)=>s+ppNet(r),0)/base.length;
  const recN=recent.reduce((s,r)=>s+ppNet(r),0)/recent.length;
  if(avgN>0&&recN<avgN*0.8)warns.push({msg:"최근 3투어 인당 순수익이 평균보다 "+Math.round((1-recN/avgN)*100)+"% 낮아요",color:"#f87171",emoji:"📉"});
  return warns;
}

// ── 스트릭 ──
function calcStreak(records){
  const sorted=[...records].filter(r=>parseInt(r.pax||0)>0&&pf(r.dailyWage)>0).sort((a,b)=>b.date.localeCompare(a.date));
  if(sorted.length<2)return{streak:0};
  const avg=sorted.reduce((s,r)=>s+ppNet(r),0)/sorted.length;
  let streak=0;for(const r of sorted){if(ppNet(r)>=avg)streak++;else break;}
  return{streak};
}

// ── 점수 엔진 ──
const DEFAULT_SCORE_CFG={wOpt:30,wShop:25,wMult:15,wPerPax:10,movingN:10,bonusThreshold:150};
function calcScore(r,allRecords,cfg=DEFAULT_SCORE_CFG){
  const pax=parseInt(r.pax||0);if(pax===0||!r.dailyWage)return null;
  const tog=r.optToggle||defOptTog();
  const maxOpt=OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+i.rate*pax,0);
  const actualOpt=OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0);
  const extraOptAmt=tExtraOpt(r);
  const optEff=maxOpt>0?(actualOpt+extraOptAmt)/maxOpt*100:0;
  const N=cfg.movingN||10;
  const prev=[...allRecords].filter(x=>x.id!==r.id&&parseInt(x.pax||0)>0&&pf(x.dailyWage)>0).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,N);
  const base=prev.length<5?allRecords.filter(x=>x.id!==r.id&&parseInt(x.pax||0)>0):prev;
  const avgPS=base.length?base.reduce((s,x)=>s+ppShop(x),0)/base.length:0;
  const avgPN=base.length?base.reduce((s,x)=>s+ppNet(x),0)/base.length:0;
  const avgM=base.length?base.reduce((s,x)=>{const d=pf(x.dailyWage);return s+(d>0?(tOpt(x)+tShop(x)+tTip(x))/d:0);},0)/base.length:1;
  const optScore=clamp((optEff/100)*cfg.wOpt,0,cfg.wOpt);
  const ps=ppShop(r);const shopScore=avgPS>0?clamp((ps/avgPS)*cfg.wShop*0.8,0,cfg.wShop):ps>0?cfg.wShop*0.5:0;
  const dw=pf(r.dailyWage);const mult=dw>0?(tOpt(r)+tShop(r)+tTip(r))/dw:0;
  const multScore=avgM>0?clamp((mult/avgM)*cfg.wMult*0.8,0,cfg.wMult):clamp(mult/3*cfg.wMult,0,cfg.wMult);
  const pn=ppNet(r);const ppScore=avgPN>0?clamp((pn/avgPN)*cfg.wPerPax*0.8,0,cfg.wPerPax):pn>0?cfg.wPerPax*0.5:0;
  const baseScore=optScore+shopScore+multScore+ppScore;
  let bonus=0;
  if(maxOpt>0&&actualOpt>=maxOpt)bonus+=5;
  bonus+=(r.extraOpt||[]).filter(i=>pf(i.amount)>0).length*5;
  if(avgPS>0&&ps>=avgPS*(cfg.bonusThreshold/100))bonus+=5;
  if(avgPN>0&&pn>=avgPN*(cfg.bonusThreshold/100))bonus+=5;
  return{total:Math.round(baseScore+bonus),baseScore:Math.round(baseScore),bonus,
    optEff:Math.round(optEff),optScore:Math.round(optScore),shopScore:Math.round(shopScore),
    multScore:Math.round(multScore),ppScore:Math.round(ppScore),
    perPaxShop:ps,perPaxNet:pn,mult,avgPS,avgPN,avgM,maxOpt,actualOpt};
}
function getGrade(score){
  if(score===null)return{label:"—",color:"#475569",emoji:"—"};
  if(score>=110)return{label:"레전드",color:"#fbbf24",emoji:"🌟"};
  if(score>=95)return{label:"마에스트로",color:"#60a5fa",emoji:"🏆"};
  if(score>=80)return{label:"프로",color:"#34d399",emoji:"⭐"};
  if(score>=75)return{label:"양호",color:"#a78bfa",emoji:"👍"};
  if(score>=60)return{label:"개선 필요",color:"#f59e0b",emoji:"📈"};
  return{label:"기초",color:"#f87171",emoji:"🔰"};
}

// ── 공통 UI 컴포넌트 (h() 방식) ──
function Toggle({on,onChange,color="#f59e0b"}){
  return h("div",{onClick:()=>onChange(!on),style:{width:38,height:22,borderRadius:11,background:on?color:"#334155",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}},
    h("div",{style:{position:"absolute",top:3,left:on?18:3,width:16,height:16,borderRadius:8,background:"#fff",transition:"left 0.2s"}})
  );
}

function Accordion({title,total,color,accent,badge,children,open,onToggle}){
  return h("div",{style:{marginBottom:12}},
    h("div",{onClick:onToggle,style:{display:"flex",justifyContent:"space-between",alignItems:"center",background:open?"#1a2942":"var(--card)",border:"1px solid "+(open?accent||"var(--border)":"var(--border)"),borderRadius:open?"12px 12px 0 0":"12px",padding:"12px 14px",cursor:"pointer"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
        h("span",{style:{fontSize:13,fontWeight:700,color:"var(--text)"}},title),
        badge&&h("span",{style:{fontSize:10,background:"rgba(128,128,128,0.15)",borderRadius:4,padding:"1px 6px",color:"var(--sub)"}},badge)
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
        h("span",{style:{fontSize:14,fontWeight:800,color:total>0?color:"#475569"}},total>0?fmt(total):"—"),
        h("span",{style:{fontSize:13,color:"#475569",display:"inline-block",transition:"transform 0.2s",transform:open?"rotate(180deg)":"rotate(0deg)"}},"▾")
      )
    ),
    open&&h("div",{style:{background:"var(--bg3)",border:"1px solid "+(accent||"var(--border)"),borderTop:"none",borderRadius:"0 0 12px 12px",padding:"14px 14px 10px"}},children)
  );
}

function InputRow({label,value,onChange,color}){
  return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
    h("label",{style:{fontSize:12,color:color||"var(--sub)",fontWeight:600,minWidth:115}},label),
    h("div",{style:{display:"flex",alignItems:"center",gap:4}},
      h("span",{style:{color:"#475569",fontSize:13}},"€"),
      h("input",{type:"number",inputMode:"decimal",placeholder:"0",value:value,onChange:e=>onChange(e.target.value),
        style:{width:88,background:"var(--bg2)",border:"1px solid "+(pf(value)>0?(color||"var(--border)"):"var(--border)"),borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}})
    )
  );
}

function ScoreBadge({score,size}){
  if(score===null)return null;
  const g=getGrade(score);const big=size==="lg";
  return h("div",{style:{display:"flex",alignItems:"center",gap:4,background:g.color+"22",border:"1px solid "+g.color+"55",borderRadius:big?10:8,padding:big?"8px 12px":"3px 8px"}},
    h("span",{style:{fontSize:big?18:11}},g.emoji),
    h("div",null,
      h("div",{style:{fontSize:big?20:13,fontWeight:800,color:g.color,lineHeight:1}},score+"점"),
      big&&h("div",{style:{fontSize:10,color:g.color,opacity:0.8}},g.label)
    )
  );
}

function BarChart({data,color}){
  color=color||"#f59e0b";
  const max=Math.max(...data.map(d=>d.value),1);
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:6,height:90,padding:"0 4px"}},
    ...data.map((d,i)=>h("div",{key:i,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
      h("div",{style:{width:"100%",background:d.color||color,borderRadius:"4px 4px 0 0",height:((d.value/max)*70)+"px",minHeight:d.value>0?4:0,opacity:0.85}}),
      h("span",{style:{fontSize:9,color:"#9ca3af",whiteSpace:"nowrap"}},d.label)
    ))
  );
}

function PieChart({data}){
  if(!data.length)return h("div",{style:{textAlign:"center",color:"var(--sub)",padding:20}},"데이터 없음");
  const total=data.reduce((s,d)=>s+d.value,0);
  let cum=-Math.PI/2;
  const slices=data.map(d=>{
    const angle=(d.value/total)*2*Math.PI;
    const x1=50+45*Math.cos(cum),y1=50+45*Math.sin(cum);cum+=angle;
    const x2=50+45*Math.cos(cum),y2=50+45*Math.sin(cum);
    const large=angle>Math.PI?1:0;
    const path=data.length===1?"M50,5 A45,45,0,1,1,49.99,5 Z":"M50,50 L"+x1+","+y1+" A45,45,0,"+large+",1,"+x2+","+y2+" Z";
    return{...d,path};
  });
  return h("div",{style:{display:"flex",alignItems:"center",gap:16}},
    h("svg",{viewBox:"0 0 100 100",style:{width:120,height:120,flexShrink:0}},
      ...slices.map((s,i)=>h("path",{key:i,d:s.path,fill:s.color,opacity:0.9}))
    ),
    h("div",{style:{flex:1}},
      ...data.map((d,i)=>h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}},
        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
          h("div",{style:{width:9,height:9,borderRadius:2,background:d.color,flexShrink:0}}),
          h("span",{style:{fontSize:11,color:"var(--sub)"}},d.label)
        ),
        h("div",{style:{textAlign:"right"}},
          h("span",{style:{fontSize:11,fontWeight:700,color:d.color}},Math.round(d.value/total*100)+"%"),
          h("div",{style:{fontSize:10,color:"var(--sub)"}},fmt(d.value))
        )
      ))
    )
  );
}

function DetailAcc({title,total,items,rec,eurRate,color,accent}){
  const[open,setOpen]=useState(false);
  const has=items.some(i=>pf(rec[i.key])>0);
  return h("div",{style:{borderBottom:"1px solid var(--border)"}},
    h("div",{onClick:()=>has&&setOpen(v=>!v),style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",cursor:has?"pointer":"default"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:6}},
        h("span",{style:{fontSize:13,color:"var(--sub)"}},title),
        has&&h("span",{style:{fontSize:10,color:"#475569",background:"var(--bg2)",borderRadius:4,padding:"1px 5px"}},open?"접기 ▴":"상세 ▾")
      ),

function ExtraItems({items,onChange,color,withPax,addLabel}){
  addLabel=addLabel||"+ 항목 추가";
  function add(){onChange([...items,{id:Date.now(),label:"",amount:"",pax:"",manualRate:""}]);}
  function remove(id){onChange(items.filter(i=>i.id!==id));}
  function update(id,field,val){
    onChange(items.map(i=>{
      if(i.id!==id)return i;
      const u={...i,[field]:val};
      if(withPax&&field==="pax"&&pf(i.manualRate)>0)u.amount=String(pf(val)*pf(i.manualRate));
      if(withPax&&field==="manualRate"&&pf(i.pax)>0)u.amount=String(pf(i.pax)*pf(val));
      return u;
    }));
  }
  return h("div",null,
    ...items.map(item=>h("div",{key:item.id,style:{marginBottom:10,background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"10px 12px"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:7}},
        h("input",{type:"text",placeholder:"항목명",value:item.label,onChange:e=>update(item.id,"label",e.target.value),

        h("button",{onClick:()=>remove(item.id),style:{background:"transparent",border:"none",color:"#ef4444",fontSize:16,cursor:"pointer",padding:"0 4px"}},"✕")
      ),
      withPax?h("div",{style:{display:"flex",alignItems:"center",gap:5}},
        h("input",{type:"number",inputMode:"numeric",placeholder:"인원",value:item.pax,onChange:e=>update(item.id,"pax",e.target.value),
          style:{width:55,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:7,padding:"7px 6px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"center"}}),
        h("span",{style:{fontSize:11,color:"var(--sub)"}},"명 ×"),
        h("span",{style:{fontSize:11,color:"#475569"}},"€"),
        h("input",{type:"number",inputMode:"decimal",placeholder:"단가",value:item.manualRate,onChange:e=>update(item.id,"manualRate",e.target.value),
          style:{width:55,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:7,padding:"7px 6px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"right"}}),
        h("span",{style:{fontSize:12,fontWeight:700,color:pf(item.amount)>0?color:"#475569",flex:1,textAlign:"right"}},pf(item.amount)>0?fmt(item.amount):"—")
      ):h("div",{style:{display:"flex",alignItems:"center",gap:4}},
        h("span",{style:{color:"#475569",fontSize:13}},"€"),
        h("input",{type:"number",inputMode:"decimal",placeholder:"0",value:item.amount,onChange:e=>update(item.id,"amount",e.target.value),
          style:{flex:1,background:"var(--bg2)",border:"1px solid "+(pf(item.amount)>0?(color||"var(--border)"):"var(--border)"),borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}})
      )
    )),
    h("button",{onClick:add,style:{width:"100%",background:"transparent",border:"1px dashed "+(color||"var(--border)"),borderRadius:9,padding:"8px",color:color||"var(--sub)",fontSize:12,fontWeight:600,cursor:"pointer",marginTop:4}},addLabel)
  );
}

  function exportJSON(){

  function exportCSV(){
