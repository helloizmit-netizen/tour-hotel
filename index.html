<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투어 호텔 노트</title>
<style>
  :root{--bg:#0e1419;--surface:#161f29;--surface2:#1e2a36;--line:#2a3744;--text:#e8eef3;--muted:#8a9aab;--accent:#e8a33d;--accent2:#3da6e8;--green:#4fc08d;--red:#e06650;--radius:16px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:radial-gradient(900px 500px at 90% -10%, rgba(232,163,61,.10), transparent 60%),radial-gradient(700px 500px at -10% 110%, rgba(61,166,232,.08), transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:140px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:rgba(14,20,25,.82);border-bottom:1px solid var(--line);}
  .head-in{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c97f1a);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(232,163,61,.35);}
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px;}
  .brand span{font-size:11px;color:var(--muted);display:block;margin-top:1px;}
  .count-pill{font-size:12px;color:var(--accent);background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);padding:5px 11px;border-radius:999px;font-weight:600;}
  .upload{margin:18px 0 8px;border:1.5px dashed var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--surface),rgba(22,31,41,.4));padding:22px 18px;text-align:center;}
  .upload .ic{font-size:30px;}
  .upload .t{font-weight:600;margin-top:6px;}
  .upload .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:12px;border-radius:12px;font-size:14px;transition:.15s;}
  .btn:active{transform:scale(.97);}
  .btn-pri{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .sched-thumb{margin-top:12px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .sched-thumb img{width:100%;display:block;}
  .sched-thumb .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
  .toolbar{display:flex;align-items:center;gap:8px;margin:22px 4px 12px;flex-wrap:wrap;}
  .toolbar .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-right:auto;}
  .backupbar{display:flex;gap:8px;margin:12px 0 0;}
  .backupbar button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .backupbar button:active{transform:scale(.97);}
  .backupbar button b{color:var(--accent2);}
  .typetabs{display:flex;gap:6px;margin:18px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;}
  .typetabs button{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;transition:.15s;}
  .typetabs button.active{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .typetabs button .n{font-size:10px;opacity:.7;margin-left:3px;}
  .pasttoursel{width:100%;margin-top:10px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;}
  /* 하단 탭바 */
  .bottomtabs{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;background:rgba(14,20,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);max-width:560px;margin:0 auto;}
  .bottomtabs button{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);padding:9px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;}
  .bottomtabs button .bi{font-size:20px;}
  .bottomtabs button.active{color:var(--accent);}
  /* 검색창 */
  .searchbox{width:100%;margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;outline:none;}
  .searchbox:focus{border-color:var(--accent2);}
  /* 투어명 헤더 */
  .tourtitle{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding:12px 14px;background:linear-gradient(135deg,rgba(232,163,61,.12),rgba(61,166,232,.06));border:1px solid var(--line);border-radius:12px;}
  .tourtitle .tt-ic{font-size:18px;}
  .tourtitle input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:15px;font-weight:700;outline:none;}
  .tourtitle .tt-edit{font-size:11px;color:var(--accent2);}
  /* 지난 투어 목록 */
  .tourlist-item{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;margin-bottom:12px;cursor:pointer;transition:.15s;}
  .tourlist-item:active{transform:scale(.99);}
  .tourlist-item .tl-ic{width:42px;height:42px;border-radius:11px;background:rgba(232,163,61,.14);display:grid;place-items:center;font-size:20px;flex-shrink:0;}
  .tourlist-item .tl-meta{flex:1;min-width:0;}
  .tourlist-item .tl-name{font-size:15px;font-weight:700;}
  .tourlist-item .tl-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .tourlist-item .tl-chev{color:var(--muted);}
  /* 지난 투어 상세 (호텔 리스트만) */
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);font-size:13px;font-weight:600;cursor:pointer;margin:16px 0 4px;background:none;border:none;font-family:inherit;}
  .simple-hotel{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;}
  .simple-hotel .sh-day{font-size:11px;color:var(--accent2);font-weight:700;min-width:42px;}
  .simple-hotel .sh-name{font-size:14px;font-weight:600;flex:1;}
  .simple-hotel .sh-city{font-size:10.5px;color:var(--accent);}
  /* 클레임 */
  .claim-sec{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .claim-sec .ttl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .claim-item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .claim-row{display:flex;gap:8px;}
  .claim-row input,.claim-row select{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;}
  .claim-room{width:90px;}
  .claim-type{flex:1;}
  .claim-memo{width:100%;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;resize:vertical;min-height:38px;}
  .claim-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:0 4px;}
  .claim-add{width:100%;padding:10px;border-radius:10px;border:1px dashed rgba(61,166,232,.4);background:rgba(61,166,232,.08);color:var(--accent2);font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;margin-top:2px;}
  /* 통계 */
  .stat-card{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .stat-card h3{margin:0 0 12px;font-size:14px;}
  .stat-bar{margin-bottom:10px;}
  .stat-bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .stat-bar .lab b{color:var(--accent);}
  .stat-bar .track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .stat-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;}
  .stat-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px;}
  .hotelstat-item{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .hotelstat-item:active{transform:scale(.99);}
  .hotelstat-item .hs-meta{flex:1;min-width:0;}
  .hotelstat-item .hs-name{font-size:14.5px;font-weight:700;}
  .hotelstat-item .hs-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .hotelstat-item .hs-badge{background:rgba(224,102,80,.15);color:var(--red);font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;padding:0 6px;}
  .hist-item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;}
  .hist-top{display:flex;align-items:center;gap:8px;}
  .hist-type{font-size:12px;font-weight:700;color:var(--accent);background:rgba(232,163,61,.12);padding:3px 9px;border-radius:6px;}
  .hist-room{font-size:11.5px;color:var(--accent2);font-weight:600;}
  .hist-tour{font-size:11px;color:var(--muted);margin-top:5px;}
  .hist-memo{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5;}
  .endtour-btn{width:100%;margin:20px 0 10px;padding:14px;border-radius:12px;border:1px solid rgba(224,102,80,.4);background:rgba(224,102,80,.1);color:var(--red);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;}
  .endtour-btn:active{transform:scale(.98);}
  .deleteall-btn{width:100%;margin:10px 0 10px;padding:13px;border-radius:12px;border:1px solid rgba(224,102,80,.55);background:rgba(224,102,80,.18);color:#ff8a72;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .deleteall-btn:active{transform:scale(.98);}
  .addfloat{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:55;max-width:528px;width:calc(100% - 32px);}
  .addfloat button{width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  /* 카드 내 분류 체크 */
  .typepick{display:flex;gap:8px;margin-top:14px;}
  .typepick .tp{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;user-select:none;}
  .typepick .tp.on{border-color:var(--accent);background:rgba(232,163,61,.14);color:var(--accent);}
  .citychips{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;-webkit-overflow-scrolling:touch;}
  .citychips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip.active{background:rgba(61,166,232,.15);border-color:var(--accent2);color:var(--accent2);font-weight:600;}
  .chip .n{font-size:10px;opacity:.7;margin-left:3px;}
  select.sortsel{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:12.5px;}
  .card{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .card-head{padding:15px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
  .daybadge{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:rgba(61,166,232,.14);border:1px solid rgba(61,166,232,.3);display:grid;place-items:center;text-align:center;line-height:1.05;}
  .daybadge b{font-size:17px;color:var(--accent2);}
  .daybadge small{font-size:9px;color:var(--muted);}
  .card-head .meta{flex:1;min-width:0;}
  .card-head .hname{font-size:16px;font-weight:700;margin:0;}
  .card-head .hsub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .citytag{font-size:10.5px;padding:2px 8px;border-radius:6px;background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);color:var(--accent);}
  .chev{color:var(--muted);font-size:13px;transition:.2s;margin-top:4px;}
  .card.open .chev{transform:rotate(90deg);}
  .quickdel{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;margin-top:2px;opacity:.55;transition:.15s;}
  .quickdel:active{opacity:1;transform:scale(.9);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
  .tag.on{color:var(--green);border-color:rgba(79,192,141,.4);background:rgba(79,192,141,.1);}
  .tag.off{color:var(--red);border-color:rgba(224,102,80,.35);background:rgba(224,102,80,.08);}
  .card-body{display:none;border-top:1px solid var(--line);padding:4px 16px 16px;}
  .card.open .card-body{display:block;}
  .field{margin-top:14px;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;transition:.15s;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2);}
  .field textarea{resize:vertical;min-height:54px;}
  .two{display:flex;gap:10px;}
  .two .field{flex:1;}
  .toggle-row{display:flex;gap:8px;margin-top:14px;}
  .tg{flex:1;text-align:center;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12.5px;color:var(--muted);transition:.15s;user-select:none;}
  .tg .ti{font-size:17px;display:block;margin-bottom:3px;}
  .tg.active-yes{border-color:rgba(79,192,141,.5);background:rgba(79,192,141,.12);color:var(--green);}
  .tg.active-no{border-color:rgba(224,102,80,.45);background:rgba(224,102,80,.1);color:var(--red);}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo img{width:100%;height:100%;object-fit:cover;}
  .photo .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border:none;color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;}
  .addphoto{width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:22px;}
  .guestcopy{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(232,163,61,.3);transition:.15s;}
  .guestcopy:active{transform:scale(.98);}
  .guestcopy.done{background:linear-gradient(135deg,var(--green),#37a877);color:#06281a;}
  .mapbtn{margin-top:16px;width:100%;padding:12px;border-radius:11px;border:1px solid rgba(61,166,232,.45);background:rgba(61,166,232,.12);color:var(--accent2);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .mapbtn:active{transform:scale(.98);}
  .card-actions{display:flex;gap:8px;margin-top:12px;}
  .save-btn{flex:2;background:rgba(79,192,141,.14);color:var(--green);border:1px solid rgba(79,192,141,.45);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;}
  .save-btn:active{transform:scale(.98);}
  .del-btn{background:rgba(224,102,80,.1);color:var(--red);border:1px solid rgba(224,102,80,.3);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;flex:1;}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);}
  .empty .ic{font-size:44px;opacity:.5;}
  .empty p{font-size:13.5px;line-height:1.6;margin-top:10px;}
  .fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;max-width:528px;width:calc(100% - 32px);display:flex;gap:10px;}
  .fab button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:15px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .fab .add{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .saved-flash{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#06281a;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:50;pointer-events:none;max-width:90%;text-align:center;}
  .saved-flash.show{opacity:1;}
  /* OCR 진행/선택 모달 */
  .modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;margin:0 auto;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--line);}
  .modal-head{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-head p{margin:4px 0 0;font-size:12px;color:var(--muted);}
  .modal-body{padding:14px 18px;overflow-y:auto;flex:1;}
  .ocr-status{text-align:center;padding:30px 10px;color:var(--muted);font-size:13.5px;}
  .ocr-bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin:14px auto 0;max-width:240px;}
  .ocr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s;}
  .cand{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);cursor:pointer;}
  .cand.sel{border-color:var(--accent2);background:rgba(61,166,232,.1);}
  .cand .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:13px;color:#06281a;}
  .cand.sel .ck{background:var(--accent2);border-color:var(--accent2);}
  .cand .nm{flex:1;font-size:14px;}
  .cand .cty{font-size:10.5px;color:var(--accent);}
  .modal-foot{padding:12px 18px 20px;border-top:1px solid var(--line);display:flex;gap:10px;}
  .modal-foot button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;padding:13px;border-radius:12px;}
  .mf-add{background:linear-gradient(135deg,var(--accent),#cf8a23);color:#1a1206;}
  .mf-cancel{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
  .manual-add{margin-top:10px;display:flex;gap:8px;}
  .manual-add input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;}
  .manual-add button{background:var(--surface2);border:1px solid var(--line);color:var(--accent2);border-radius:10px;padding:0 14px;font-family:inherit;font-weight:600;cursor:pointer;}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>
  <div class="head-in">

<script>
const CITIES=['이스탄불','앙카라','부르사','이즈미르','쿠샤다스','파묵칼레','카파도키아','콘야','안탈리아','아피온','아이발륵'];

  '이스탄불':{breakfast:'07:00~10:00',alcohol:true},'앙카라':{breakfast:'07:00~09:30',alcohol:true},

  '파묵칼레':{breakfast:'07:30~09:30',alcohol:true},'카파도키아':{breakfast:'07:00~10:00',alcohol:true},
  '콘야':{breakfast:'07:00~09:00',alcohol:false},'안탈리아':{breakfast:'07:00~10:00',alcohol:true},
  '아피온':{breakfast:'07:00~09:30',alcohol:false},
  '쿠샤다스':{breakfast:'07:00~10:00',alcohol:true},'아이발륵':{breakfast:'07:00~09:30',alcohol:true}
};
const CITY_EN={'이스탄불':'Istanbul','앙카라':'Ankara','부르사':'Bursa','이즈미르':'Izmir','쿠샤다스':'Kusadasi','파묵칼레':'Pamukkale','카파도키아':'Cappadocia','콘야':'Konya','안탈리아':'Antalya','아피온':'Afyon','아이발륵':'Ayvalik'};

/* 호텔 사전: "도시+호텔명" 정규화 키로 정보 보관 */
function loadLib(){try{const r=localStorage.getItem(LIBKEY);if(r)return JSON.parse(r);}catch(e){}return{};}
function saveLib(lib){try{localStorage.setItem(LIBKEY,JSON.stringify(lib));}catch(e){}}
function normKey(city,name){
  const n=(s)=>(s||'').toLowerCase().replace(/[\s\-_.,'"()]/g,'').replace(/hotel|호텔/g,'');
  return n(city)+'|'+n(name);
}
/* 과거 일정표에서 추출한 호텔명 시드 (최초 1회 주입, 학습 출발점) */
const SEED_HOTELS={
  '이스탄불':['PULLMAN','CROWNE PLAZA HARBIYE','SHERATON ATAKOY','CHIRAGAN PALACE KEMPINSKI','DELTA ISTANBUL WEST','WANDA VISTA','MARRIOTT PENDIK','SHERATON ISTANBUL ESENYURT'],
  '앙카라':['NEWPARK ANKARA','GRAND ANKARA HOTEL','GREEN PARK'],
  '카파도키아':['ORTAHISAR CAVE','DOUBLETREE BY HILTON AVANOS','ALP','CRYSTAL KAYMAKLI','SUHAN','PERISSIA','NUJELM','HANEDAN CAPPADOCIA SUITES'],
  '아피온':['NG AFYON'],
  '콘야':['NOVOTEL KONYA','GRAND KONYA','RAMADA KONYA','BAYIR DIAMOND'],
  '안탈리아':['HOLIDAY INN LARA','DOUBLETREE BY HILTON ANTALYA'],
  '파묵칼레':['ADEM PIRA','LYCUS','RICHMOND','DOGA THERMAL','RENEX'],
  '이즈미르':['KAYA IZMIR THERMAL'],
  '쿠샤다스':['RAMADA SUIT'],
  '부르사':['BAIA BURSA'],
  '아이발륵':['GRAND TEMIZEL']
};
const SEED_FLAG='tour_hotel_seed_done_v7';
/* 일부 호텔의 주소 (시드 주입 시 함께 저장) */
const SEED_ADDR={};
SEED_ADDR[normKey('카파도키아','HANEDAN CAPPADOCIA SUITES')]='Yukarı mevki Şehit Ramazan Çelik Sk. Mustafapaşa, Ürgüp, Nevşehir / Türkiye, 50420';
function seedLibraryOnce(){
  if(localStorage.getItem(SEED_FLAG))return;        // 이미 이 버전 주입했으면 건너뜀
  const lib=loadLib();
  // 이전 시드(사용자가 안 건드린 seeded 항목)는 제거하고 새 시드로 다시 깔기. 직접 입력/저장한 건 보존.
  Object.keys(lib).forEach(k=>{const r=lib[k];if(r&&r.seeded&&(!r.savedAt||r.savedAt===0)&&!r.wifiSsid&&!r.wifiPw&&!r.breakfast)delete lib[k];});
  Object.keys(SEED_HOTELS).forEach(city=>{
    SEED_HOTELS[city].forEach(name=>{
      const k=normKey(city,name);
      if(!lib[k]){lib[k]={name:name,city:city,address:SEED_ADDR[k]||'',wifiSsid:'',wifiId:'',wifiPw:'',breakfast:'',dinner:'',structure:'',lobbyBtn:'',elevator:null,alcohol:null,seeded:true,savedAt:0};}
      else if(SEED_ADDR[k]&&!lib[k].address){lib[k].address=SEED_ADDR[k];}
    });
  });
  saveLib(lib);
  localStorage.setItem(SEED_FLAG,'1');
}
/* 카드 정보를 사전에 저장(이름·도시 있을 때만) */
function libStore(h){
  if(!h.name||!h.city)return;
  const lib=loadLib();
  const key=normKey(h.city,h.name);
  const prev=lib[key]||{};
  // 사진: 현재 호텔에 사진이 있으면 그걸 저장(최대 4장), 없으면 기존 사전 사진 유지
  const photos=(h.photos&&h.photos.length)?h.photos.slice(0,4):(prev.photos||[]);
  // 메모: 현재 입력값 우선, 없으면 기존 사전 메모 유지
  const notes=(h.notes&&h.notes.trim())?h.notes:(prev.notes||'');
  lib[key]={name:h.name,city:h.city,address:h.address||prev.address||'',wifiSsid:h.wifiSsid,wifiId:h.wifiId,wifiPw:h.wifiPw,breakfast:h.breakfast,dinner:h.dinner,structure:h.structure,lobbyBtn:h.lobbyBtn,elevator:h.elevator,alcohol:h.alcohol,notes:notes,photos:photos,savedAt:Date.now()};
  saveLib(lib);
}
/* 사전에서 조회 */
function libLookup(city,name){if(!city||!name)return null;const lib=loadLib();return lib[normKey(city,name)]||null;}
/* 빈 칸만 사전 값으로 채우기. 반환: 채운 항목 수 */
function libFill(h){
  const rec=libLookup(h.city,h.name);if(!rec)return 0;
  let cnt=0;
  ['wifiSsid','wifiId','wifiPw','breakfast','dinner','structure','lobbyBtn','address','notes'].forEach(f=>{if(!h[f]&&rec[f]){h[f]=rec[f];cnt++;}});
  ['elevator','alcohol'].forEach(f=>{if(h[f]===null&&rec[f]!==null&&rec[f]!==undefined){h[f]=rec[f];cnt++;}});
  // 사진: 현재 호텔에 사진이 없고 사전에 있으면 불러오기
  if((!h.photos||h.photos.length===0)&&rec.photos&&rec.photos.length){h.photos=rec.photos.slice();cnt++;}
  return cnt;
}
let state=load();let activePhotoHotel=null;let filterCity='전체';let sortMode='order';
const TOUR_TYPES=['성지순례','한진관광'];
let filterType='전체';
let mainView='current';  // 'current' | 'past' | 'stats'
let viewingPastTourId=null;
let hotelSearch='';
/* 구버전 호환: wifiName → wifiSsid */
(function migrate(){let ch=false;(state.hotels||[]).forEach(h=>{if(h.wifiName!==undefined){if(!h.wifiSsid)h.wifiSsid=h.wifiName;delete h.wifiName;ch=true;}if(h.wifiId===undefined)h.wifiId='';if(!Array.isArray(h.types)){h.types=[];ch=true;}});if(ch)localStorage.setItem(KEY,JSON.stringify(state));
const lib=loadLib();let lc=false;Object.keys(lib).forEach(k=>{const r=lib[k];if(r.wifiName!==undefined){if(!r.wifiSsid)r.wifiSsid=r.wifiName;delete r.wifiName;lc=true;}});if(lc)saveLib(lib);})();
seedLibraryOnce();
/* 투어 회차 마이그레이션: tours가 없으면 기존 호텔을 '이전 기록' 투어로 묶음 */
(function migrateTours(){
  if(!Array.isArray(state.tours))state.tours=[];
  if(state.currentTourId===undefined)state.currentTourId=null;
  let changed=false;
  if(state.tours.length===0){
    if(state.hotels.length>0){
      const tid='t'+Date.now().toString(36);
      state.tours.push({id:tid,name:'이전 기록',createdAt:Date.now()});
      state.hotels.forEach(h=>{if(!h.tourId)h.tourId=tid;});
      state.currentTourId=tid;
      changed=true;
    }
  }else{
    // tourId 없는 호텔은 현재 투어로 귀속
    const cur=state.currentTourId||(state.tours[state.tours.length-1]&&state.tours[state.tours.length-1].id);
    state.hotels.forEach(h=>{if(!h.tourId){h.tourId=cur;changed=true;}});
  }
  if(changed)localStorage.setItem(KEY,JSON.stringify(state));
})();

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return{schedule:null,hotels:[],tours:[],currentTourId:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));flash();}catch(e){alert('저장 공간이 부족합니다. 사진 수를 줄여주세요.');}}
function flash(){const f=document.getElementById('flash');f.textContent='저장됨 ✓';f.classList.add('show');setTimeout(()=>f.classList.remove('show'),1100);}
function toast(msg){const f=document.getElementById('flash');f.textContent=msg;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),2400);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const CLAIM_TYPES=['객실 문제','냉/난방 문제','화장실 문제','음식 문제','기타 시설 문제'];
function blankHotel(name='',dayLabel='',city=''){return{id:uid(),tourId:state.currentTourId||null,name,dayLabel,city,address:'',types:[],wifiSsid:'',wifiId:'',wifiPw:'',breakfast:'',dinner:'',structure:'',lobbyBtn:'',elevator:null,alcohol:null,notes:'',claims:[],photos:[]};}
/* 새 투어 생성 후 현재 투어로 지정 */
function createNewTour(name){
  if(!name){const d=new Date();const yy=String(d.getFullYear()).slice(2);const mm=('0'+(d.getMonth()+1)).slice(-2);const dd=('0'+d.getDate()).slice(-2);name=yy+mm+dd+' 투어';}
  const tid='t'+Date.now().toString(36);
  state.tours.push({id:tid,name:name,createdAt:Date.now()});
  state.currentTourId=tid;
  mainView='current';viewingPastTourId=null;
  return tid;
}
function currentHotels(){return state.hotels.filter(h=>h.tourId===state.currentTourId);}
function tourName(id){const t=state.tours.find(x=>x.id===id);return t?t.name:'투어';}
function guessCity(text){const t=(text||'').toLowerCase();for(const c of CITIES){for(const kw of CITY_HINTS[c]){if(t.includes(kw.toLowerCase()))return c;}}return '';}

/* 고객 안내문 (카카오톡용 꾸민 문구) */

  const L=[];
  L.push('🏨 오늘의 숙소 안내');
  L.push('━━━━━━━━━━━━━');
  L.push('');
  L.push('🏨 호텔  '+(h.name||'-'));
  L.push('');
  L.push('📶 와이파이');
  L.push('   • 와이파이 명  '+(h.wifiSsid||'-'));
  L.push('   • 이름  '+(h.wifiId||'-'));
  L.push('   • 비밀번호  '+(h.wifiPw||'-'));
  L.push('');
  L.push('🍳 익일 조식 제공 시간  '+(h.breakfast?h.breakfast.split('~')[0].trim():'-')+' 부터');
  if(h.lobbyBtn){L.push('');L.push('🛗 로비층은 엘리베이터에서 ['+h.lobbyBtn+'] 버튼을 눌러주세요.');}
  L.push('');
  L.push('━━━━━━━━━━━━━');
  L.push('와이파이 접속이 어려우신 분들은 로비 또는 석식 시간에 제가 도움드리겠습니다.');
  return L.join('\n');

function copyGuest(h,btn){
  const msg=buildGuestMessage(h);
  const done=()=>{if(btn){btn.classList.add('done');const o=btn.textContent;btn.textContent='✓ 복사 완료! 카카오톡에 붙여넣으세요';setTimeout(()=>{btn.classList.remove('done');btn.textContent=o;},1800);}toast('안내문이 복사되었어요');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(done).catch(()=>fb(msg,done));}
  else fb(msg,done);
}
function fb(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){alert('복사 실패. 길게 눌러 복사하세요.');}document.body.removeChild(ta);}

/* ===== OCR: 일정표 사진에서 호텔명 자동 추출 ===== */
let ocrCandidates=[];
const modal=()=>document.getElementById('ocrModal');

function openOcrModal(){modal().classList.add('show');document.getElementById('ocrFoot').style.display='none';}
function closeOcrModal(){modal().classList.remove('show');ocrCandidates=[];}

/* OCR 결과 텍스트에서 호텔명 후보 뽑기 */
/* 사전(학습)에 저장된 호텔명 목록 */
function knownHotelNames(){
  const lib=loadLib();const names=[];
  Object.keys(lib).forEach(k=>{if(lib[k]&&lib[k].name)names.push(lib[k].name);});
  return names;
}
/* 비교용 정규화 */
function normName(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
/* 알려진 호텔 브랜드 (사전이 비어도 잡을 기본 목록) */
const HOTEL_BRANDS=['PULLMAN','HILTON','HOLIDAY INN','GREEN PARK','RAMADA','RADISSON','SHERATON','MARRIOTT','NOVOTEL','MERCURE','IBIS','CROWNE PLAZA','WYNDHAM','DOUBLETREE','DEDEMAN','DIVAN','RIXOS','HYATT','CONRAD','SWISSOTEL','MOVENPICK','KAYA','LIMAK','TITANIC','RICHMOND','PERISSIA','SUHAN','LYCUS','RENEX','WANDA VISTA','KEMPINSKI','BAYIR DIAMOND','ADEM PIRA','ORTAHISAR','NUJELM','NG AFYON','TEMIZEL','NEWPARK','CHIRAGAN','DELTA','BAIA','CRYSTAL KAYMAKLI','DOGA THERMAL'];

/* 레벤슈타인 거리(편집 거리) — OCR 오타 흡수용 */
function editDist(a,b){
  a=a||'';b=b||'';const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    let cur=[i];
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
    }
    prev=cur;
  }
  return prev[n];
}
/* 두 정규화 문자열의 유사도(0~1) */
function similarity(a,b){const d=editDist(a,b);const L=Math.max(a.length,b.length);return L?1-d/L:0;}

/* 텍스트(정규화 전체)에 후보명이 정확히 포함되는지 */
function containsExact(normText,name){const nk=normName(name);return nk.length>=3 && normText.includes(nk);}

/* 텍스트의 단어 조각들 중 후보명과 유사한 게 있는지 (OCR 오타 대응) */
function fuzzyInText(words,name){
  const nk=normName(name);if(nk.length<4)return 0;
  let best=0;
  // 후보가 N단어면 텍스트에서 연속 N단어 묶음과 비교
  const parts=name.trim().split(/\s+/).length;
  for(let i=0;i<words.length;i++){
    for(let span=1;span<=parts+1 && i+span<=words.length;span++){
      const chunk=normName(words.slice(i,i+span).join(''));
      if(chunk.length<3)continue;
      const s=similarity(chunk,nk);
      if(s>best)best=s;
    }
  }
  return best;
}

/* 일정표 텍스트의 연속 단어 묶음이 사전 호텔명과 거의 같으면 매칭 (HOLIDAY INN → HOLIDAY INN LARA 흡수, 단어 하나만 겹치는 오작동은 방지) */
function phraseMatch(words,name){
  const parts=name.trim().split(/\s+/);
  if(parts.length<2)return false;
  const nk=normName(name);
  for(let i=0;i<words.length;i++){
    for(let span=2;span<=4 && i+span<=words.length;span++){
      const phrase=normName(words.slice(i,i+span).join(''));
      if(phrase.length<6)continue;
      // 유사도 높거나, 접두/접미인데 호텔명의 70% 이상을 차지할 때만 (단어 하나 겹침 방지)
      if(similarity(phrase,nk)>=0.82)return true;
      if((nk.startsWith(phrase)||nk.endsWith(phrase)) && phrase.length>=nk.length*0.7)return true;
    }
  }
  return false;
}

function extractHotelCandidates(text){
  const normText=normName(text);
  const words=text.toUpperCase().split(/[^A-Z0-9]+/).filter(w=>w.length>=2);
  const found=[];const seen=new Set();
  const push=(name,score)=>{const key=normName(name);if(key.length<3||seen.has(key))return;seen.add(key);found.push({name:name.trim().replace(/\s+/g,' '),score});};

  // 후보 풀: 학습된 사전 호텔명 + 기본 브랜드
  const known=knownHotelNames();
  const pool=[];
  known.forEach(n=>pool.push({name:n,base:100}));
  HOTEL_BRANDS.forEach(n=>{if(!pool.some(p=>normName(p.name)===normName(n)))pool.push({name:n,base:78});});

  pool.forEach(p=>{
    if(containsExact(normText,p.name)){push(p.name,p.base);return;}     // 정확 포함
    const sim=fuzzyInText(words,p.name);
    if(sim>=0.80){push(p.name,Math.round(p.base*sim)-10);return;}        // 유사(오타) 매칭
    if(phraseMatch(words,p.name))push(p.name,p.base-20);                 // 구절 포함(부분표기 흡수)
  });

  // 계열 중복 제거: 한 이름이 다른 이름을 통째로 포함하면(HOLIDAY INN ⊂ HOLIDAY INN LARA) 점수 높은 쪽만 남김
  found.sort((a,b)=>b.score-a.score);
  const kept=[];
  found.forEach(c=>{
    const ck=normName(c.name);
    const dup=kept.find(k=>{const kk=normName(k.name);return kk.includes(ck)||ck.includes(kk);});
    if(!dup)kept.push(c);
  });
  return kept;
}

function startOcr(dataUrl){
  openOcrModal();
  const body=document.getElementById('ocrBody');const sub=document.getElementById('ocrSub');
  sub.textContent='사진을 분석하고 있어요... (10~30초 정도 걸려요)';
  body.innerHTML='<div class="ocr-status">🔍 글자를 읽는 중...<div class="ocr-bar"><i id="ocrProg"></i></div></div>';
  if(typeof Tesseract==='undefined'){
    sub.textContent='OCR 모듈을 불러오지 못했어요 (인터넷 연결 확인)';
    showManualOnly();return;
  }
  Tesseract.recognize(dataUrl,'eng',{logger:m=>{if(m.status==='recognizing text'){const p=document.getElementById('ocrProg');if(p)p.style.width=Math.round(m.progress*100)+'%';}},tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz 0123456789'})
    .then(({data})=>{
      const cands=extractHotelCandidates(data.text||'');
      showCandidates(cands);
    })
    .catch(()=>{document.getElementById('ocrSub').textContent='분석에 실패했어요. 직접 입력해 주세요.';showManualOnly();});
}

function showCandidates(cands){
  // 도시까지 매칭되는 호텔만 후보로. (도시 없는 파편 RAMADA/WYNDHAM/KAYA 등 제외)
  ocrCandidates=cands.map(c=>{
    let city='';const lib=loadLib();
    Object.keys(lib).forEach(k=>{if(lib[k]&&normName(lib[k].name)===normName(c.name)&&lib[k].city)city=lib[k].city;});
    if(!city)city=guessCity(c.name);
    return {name:c.name,city:city,sel:c.score>=50};
  }).filter(c=>c.city);  // 도시 없는 후보는 표시하지 않음
  const body=document.getElementById('ocrBody');const sub=document.getElementById('ocrSub');
  const high=ocrCandidates.filter(c=>c.sel).length;
  if(ocrCandidates.length===0){
    sub.textContent='호텔을 자동으로 찾지 못했어요. 아래에서 직접 입력해 주세요.';
  }else{
    sub.textContent='호텔 후보예요 ('+ocrCandidates.length+'곳) · 맞는 것만 남기세요';
  }
  renderCandidates();
  document.getElementById('ocrFoot').style.display='flex';
}
function showManualOnly(){ocrCandidates=[];renderCandidates();document.getElementById('ocrFoot').style.display='flex';}

function renderCandidates(){
  const body=document.getElementById('ocrBody');

}

/* 호텔명별 집계: 이용횟수(투어 수), 클레임 수, 유형, 히스토리 */
function buildHotelStats(){
  const stats={};  // key: 정규화 호텔명
  state.hotels.forEach(h=>{
    const name=h.name||'(미입력)';
    const key=normName(name)||name;
    if(!stats[key])stats[key]={name:name,city:h.city||'',uses:0,tourIds:new Set(),claims:0,byType:{},history:[]};
    const s=stats[key];
    if(h.city&&!s.city)s.city=h.city;
    s.uses++;
    if(h.tourId)s.tourIds.add(h.tourId);
    (h.claims||[]).forEach(cl=>{
      s.claims++;
      const t=cl.type&&cl.type.trim()?cl.type.trim():'기타';
      s.byType[t]=(s.byType[t]||0)+1;
      s.history.push({tour:tourName(h.tourId),tourId:h.tourId,room:cl.room||'',type:t,memo:cl.memo||''});
    });
  });
  return stats;
}

  // 호텔 리스트 (클레임 많은 순 → 이용 많은 순)
  const sorted=keys.sort((a,b)=>stats[b].claims-stats[a].claims||stats[b].uses-stats[a].uses);

  vs.innerHTML=html;

      '<div class="field"><label>📍 주소</label><textarea data-f="address" placeholder="호텔 주소">'+escapeHtml(h.address||'')+'</textarea></div>'+
      '<button class="mapbtn" data-act="openmap">🗺️ 구글 지도에서 위치 보기</button>'+

function escapeHtml(s){return(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escapeAttr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

document.getElementById('btnBackup').onclick=function(){
  const data={version:1,exportedAt:new Date().toISOString(),notes:state,library:loadLib()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();const stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href=url;a.download='투어호텔노트_백업_'+stamp+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('백업 파일을 저장했어요 💾');
};
document.getElementById('btnRestore').onclick=function(){document.getElementById('restoreInput').click();};
document.getElementById('restoreInput').onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data||!data.notes||!Array.isArray(data.notes.hotels))throw new Error('형식 오류');
      const cur=state.hotels.length;const lib=loadLib();const libCur=Object.keys(lib).length;
      if(!confirm('복원하면 현재 데이터에 백업 내용이 합쳐집니다.\n\n현재 호텔 '+cur+'곳 / 사전 '+libCur+'곳\n백업 호텔 '+data.notes.hotels.length+'곳 / 사전 '+Object.keys(data.library||{}).length+'곳\n\n진행할까요?'))return;
      if(!Array.isArray(state.tours))state.tours=[];
      // 백업에 투어 정보가 있으면 그대로 병합
      const btours=Array.isArray(data.notes.tours)?data.notes.tours:[];
      const existTourIds=new Set(state.tours.map(t=>t.id));
      btours.forEach(t=>{if(!existTourIds.has(t.id)){state.tours.push(t);existTourIds.add(t.id);}});
      // 복원될 호텔 중 tourId가 없거나 매칭되는 투어가 없는 것들을 모아 새 투어로 묶기
      const ids=new Set(state.hotels.map(h=>h.id));
      const orphans=[];
      const incoming=data.notes.hotels.filter(h=>!ids.has(h.id));
      incoming.forEach(h=>{if(!h.tourId||!existTourIds.has(h.tourId))orphans.push(h);});
      let restoreTourId=null;
      if(orphans.length>0){
        restoreTourId='t'+Date.now().toString(36);
        const label=(data.exportedAt?String(data.exportedAt).slice(0,10):'')+' 복원';
        state.tours.push({id:restoreTourId,name:'복원된 기록 ('+orphans.length+'곳)',createdAt:Date.now()});
        existTourIds.add(restoreTourId);
      }
      incoming.forEach(h=>{
        if(!h.tourId||!existTourIds.has(h.tourId)||orphans.indexOf(h)>=0)h.tourId=restoreTourId;
        if(!Array.isArray(h.claims))h.claims=[];
        state.hotels.push(h);
      });
      // 사전 병합 (백업이 더 최신이면 갱신)
      const merged=loadLib();const bl=data.library||{};
      Object.keys(bl).forEach(k=>{if(!merged[k]||(bl[k].savedAt||0)>(merged[k].savedAt||0))merged[k]=bl[k];});
      saveLib(merged);
      // 복원한 호텔은 지난 투어 탭에서 보여주기
      if(restoreTourId){mainView='past';viewingPastTourId=restoreTourId;}
      save();render();
      toast('복원 완료 ✓ '+incoming.length+'곳 · 지난 투어에서 확인하세요');
    }catch(err){alert('복원 실패: 올바른 백업 파일이 아니에요.');}
  };
  fr.readAsText(f);e.target.value='';
};

/* OCR 모달 이벤트 */
document.getElementById('ocrModal').addEventListener('click',e=>{
  if(e.target.id==='ocrModal'){closeOcrModal();return;}
  const cand=e.target.closest('.cand');
  if(cand){const i=+cand.dataset.ci;ocrCandidates[i].sel=!ocrCandidates[i].sel;renderCandidates();return;}
  const act=e.target.closest('[data-act]')?e.target.closest('[data-act]').dataset.act:null;
  if(act==='manualadd'){const inp=document.getElementById('manualName');const v=inp.value.trim();if(v){ocrCandidates.push({name:v,city:guessCity(v),sel:true});renderCandidates();}return;}
  if(act==='ocrcancel'){closeOcrModal();return;}
  if(act==='ocradd'){
    const picks=ocrCandidates.filter(c=>c.sel);
    if(picks.length===0){toast('선택된 호텔이 없어요');return;}
    if(!state.currentTourId)createNewTour();
    let day=currentHotels().length;let autoCnt=0;
    picks.forEach(c=>{day++;const h=blankHotel(c.name,'Day '+day,c.city);if(libFill(h)>0)autoCnt++;state.hotels.push(h);});
    mainView='current';save();render();closeOcrModal();
    toast(picks.length+'개 추가'+(autoCnt?' · '+autoCnt+'곳 정보 자동 불러옴 ✓':' ✓'));
    return;
  }
});

function addHotel(){
  if(!state.currentTourId)createNewTour();
  if(mainView!=='current'){mainView='current';viewingPastTourId=null;}
  const dayNum=currentHotels().length+1;
  const h=blankHotel('','Day '+dayNum,filterCity!=='전체'?filterCity:'');
  h._open=true;state.hotels.push(h);save();render();
  setTimeout(()=>{const el=document.querySelector('[data-id="'+h.id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},80);
}

document.getElementById('photoInput').onchange=function(e){const files=[...e.target.files];if(!files.length||!activePhotoHotel)return;const h=state.hotels.find(x=>x.id===activePhotoHotel);if(!h)return;let done=0;files.forEach(f=>resizeImage(f,900,d=>{h.photos.push(d);done++;if(done===files.length){libStore(h);save();render();reopenAndScroll(h.id);}}));e.target.value='';};

document.getElementById('list').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const h=state.hotels.find(x=>x.id===card.dataset.id);if(!h)return;
  const actEl=e.target.closest('[data-act]');const act=actEl?actEl.dataset.act:null;
  if(act==='copyguest'){copyGuest(h,actEl);return;}
  if(act==='openmap'){
    if(!h.name&&!h.address){toast('호텔명이나 주소를 먼저 입력해 주세요');return;}
    let q;
    if(h.address&&h.address.trim()){q=encodeURIComponent((h.name?h.name+' ':'')+h.address.trim());}
    else{const cityEn=CITY_EN[h.city]||h.city||'';q=encodeURIComponent(h.name+' '+cityEn+' Turkey');}
    window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank');
    return;
  }
  if(act==='savecard'){libStore(h);save();h._open=false;render();toast('저장되었습니다 ✓ (호텔 사전에 기록)');return;}
  if(act==='quickdel'){if(confirm('"'+(h.name||'이 호텔')+'"을(를) 삭제할까요?')){state.hotels=state.hotels.filter(x=>x.id!==h.id);save();render();}return;}
  if(act==='toggle'){h._open=!h._open;card.classList.toggle('open');return;}
  if(act==='delete'){if(confirm('이 호텔을 삭제할까요?')){state.hotels=state.hotels.filter(x=>x.id!==h.id);save();render();}return;}
  if(act==='addphoto'){activePhotoHotel=h.id;document.getElementById('photoInput').click();return;}
  if(act==='rmphoto'){h.photos.splice(+e.target.dataset.pi,1);libStore(h);save();render();reopenAndScroll(h.id);return;}
  if(act==='claimadd'){if(!Array.isArray(h.claims))h.claims=[];h.claims.push({room:'',type:'',memo:''});save();render();reopenAndScroll(h.id);return;}
  if(act==='claimdel'){const ci=+e.target.closest('[data-ci]').dataset.ci;h.claims.splice(ci,1);save();render();reopenAndScroll(h.id);return;}
  const tp=e.target.closest('.tp');
  if(tp){const t=tp.dataset.type;if(!Array.isArray(h.types))h.types=[];const i=h.types.indexOf(t);if(i>=0)h.types.splice(i,1);else h.types.push(t);save();render();reopenAndScroll(h.id);return;}
  const tg=e.target.closest('.tg');
  if(tg){const grp=tg.closest('[data-grp]').dataset.grp;const val=tg.dataset.val==='yes';h[grp]=(h[grp]===val)?null:val;save();render();reopenAndScroll(h.id);}
});

function reopenAndScroll(id){const h=state.hotels.find(x=>x.id===id);if(h)h._open=true;render();setTimeout(()=>{const el=document.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'});},50);}
function resizeImage(file,maxW,cb){const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{let w=img.width,hh=img.height;if(w>maxW){hh=hh*maxW/w;w=maxW;}const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);cb(cv.toDataURL('image/jpeg',0.72));};img.src=fr.result;};fr.readAsDataURL(file);}
